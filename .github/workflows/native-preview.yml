          git add app scripts tests documentation LICENSE README.md .gitignore STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Implement independent native MantisTV API25 preview and cloud build checks'
            gh auth setup-git
            git push origin HEAD:main
          fi
      - name: Compile and verify native preview
        working-directory: project
        run: |
          if ! bash scripts/build.sh; then
            test ! -f out/javac-diagnostics.txt || cat out/javac-diagnostics.txt
            exit 1
          fi
      - name: Publish APK, source and checksums as free release assets
        working-directory: project
        run: |
          set -euo pipefail
          git archive --format=zip --output=releases/MantisTV-source.zip HEAD
          cp LICENSE documentation/INSTALLATION-GUIDE.md documentation/ROLLBACK-GUIDE.md releases/
          (cd releases && sha256sum *.apk *.zip *.txt *.md LICENSE > SHA256SUMS.txt)
          gh release create "preview-$GITHUB_RUN_ID" releases/* --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease --title 'MantisTV 0.1.0 native development preview' --notes-file releases/BUILD-REPORT.txt
          cat releases/BUILD-REPORT.txt >> "$GITHUB_STEP_SUMMARY"
