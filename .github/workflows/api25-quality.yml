              " private android.content.SharedPreferences prefs;",
              " private LinearLayout body, root;",
              " private String page=\"Home\", profile=\"0\", focusToken=\"nav:Home\";",
              " private boolean resumed=false, reduced=false, destroyed=false;",
              " private long lastBack=0;",
              " private int accent=0xff86e9c6;",
              " private final Runnable idle=()->screensaver();",
              " private static class AppItem {String pkg,label; Intent intent; AppItem(String p,String l,Intent i){pkg=p;label=l;intent=i;}}",
              " @Override public void onCreate(Bundle state){super.onCreate(state);prefs=getSharedPreferences(\"mantistv\",MODE_PRIVATE);profile=prefs.getString(\"profile\",\"0\");reduced=prefs.getBoolean(\"reduced\",false);discover();show(\"Home\");}",
              " @Override protected void onResume(){super.onResume();resumed=true;discover();if(root!=null)show(page);armIdle();}",
              " @Override protected void onPause(){resumed=false;handler.removeCallbacks(idle);super.onPause();}",
              " @Override protected void onDestroy(){destroyed=true;handler.removeCallbacksAndMessages(null);worker.shutdownNow();icons.evictAll();super.onDestroy();}",
              " @Override public void onUserInteraction(){super.onUserInteraction();armIdle();}",
              " private void armIdle(){handler.removeCallbacks(idle);if(resumed && !page.equals(\"Screensaver\"))handler.postDelayed(idle,300000);}",
              " private int dp(float n){return (int)(n*getResources().getDisplayMetrics().density+.5f);}",
              " private String key(String name){return \"p\"+profile+\".\"+name;}",
              " private ArrayList<String> list(String name){ArrayList<String> out=new ArrayList<>();try{JSONArray a=new JSONArray(prefs.getString(key(name),\"[]\"));for(int i=0;i<a.length();i++)out.add(a.getString(i));}catch(JSONException ignored){}return out;}",
              " private void save(String name,List<String> value){prefs.edit().putString(key(name),new JSONArray(value).toString()).apply();}",
              " private void discover(){apps.clear();HashSet<String> seen=new HashSet<>();PackageManager pm=getPackageManager();for(String cat:new String[]{Intent.CATEGORY_LEANBACK_LAUNCHER,Intent.CATEGORY_LAUNCHER}){Intent q=new Intent(Intent.ACTION_MAIN).addCategory(cat);for(ResolveInfo r:pm.queryIntentActivities(q,0)){if(r.activityInfo==null || !r.activityInfo.exported || !r.activityInfo.enabled)continue;String pkg=r.activityInfo.packageName;if(pkg.equals(getPackageName())||!seen.add(pkg))continue;Intent launch=new Intent(Intent.ACTION_MAIN).addCategory(cat).setComponent(new ComponentName(pkg,r.activityInfo.name)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);apps.add(new AppItem(pkg,r.loadLabel(pm).toString(),launch));}}Collections.sort(apps,(a,b)->a.label.compareToIgnoreCase(b.label));}",
