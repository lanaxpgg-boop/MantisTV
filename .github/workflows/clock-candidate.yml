              "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"dev.mantistv.home\" android:versionCode=\"5\" android:versionName=\"0.4.1-preview\"><uses-sdk android:minSdkVersion=\"25\" android:targetSdkVersion=\"25\"/><uses-feature android:name=\"android.hardware.touchscreen\" android:required=\"false\"/><uses-feature android:name=\"android.software.leanback\" android:required=\"false\"/><uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/><application android:label=\"MantisTV\" android:icon=\"@drawable/icon\" android:banner=\"@drawable/banner\" android:theme=\"@android:style/Theme.Material.NoActionBar\" android:allowBackup=\"false\" android:hardwareAccelerated=\"true\"><activity android:name=\".MainActivity\" android:exported=\"true\" android:screenOrientation=\"landscape\" android:launchMode=\"singleTask\"><intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/><category android:name=\"android.intent.category.LEANBACK_LAUNCHER\"/></intent-filter></activity></application></manifest>"
