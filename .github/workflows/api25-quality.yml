              "  ArrayList<AppItem> fav=selected(list(\"favorites\"));if(fav.isEmpty())fav.addAll(apps.subList(0,Math.min(6,apps.size())));section(\"Dock\",fav);ArrayList<AppItem> recent=selected(list(\"recent\"));if(!recent.isEmpty())section(\"Top Shelf · recently opened\",recent.subList(0,Math.min(6,recent.size())));body.addView(text(\"Continue Watching from streaming providers is not available in this preview. Your local watchlist is in the navigation bar.\",14));}",
              " private ArrayList<AppItem> selected(List<String> names){ArrayList<AppItem> out=new ArrayList<>();for(String p:names)for(AppItem a:apps)if(a.pkg.equals(p)){out.add(a);break;}return out;}",
              " private void section(String title,List<AppItem> entries){body.addView(text(title,22));if(entries.isEmpty()){body.addView(text(\"No applications here yet.\",16));return;}GridLayout grid=new GridLayout(this);grid.setColumnCount(6);grid.setClipChildren(false);grid.setPadding(dp(4),dp(8),dp(4),dp(10));for(AppItem a:entries){LinearLayout card=new LinearLayout(this);card.setGravity(Gravity.CENTER);card.setOrientation(LinearLayout.VERTICAL);card.setPadding(dp(8),dp(8),dp(8),dp(6));card.setBackground(glass(0x443d4e60));card.setContentDescription(a.label);card.setTag(\"app:\"+a.pkg);ImageView image=new ImageView(this);image.setScaleType(ImageView.ScaleType.FIT_CENTER);card.addView(image,new LinearLayout.LayoutParams(dp(46),dp(46)));loadIcon(a.pkg,image);TextView label=text(a.label,13);label.setSingleLine(true);label.setEllipsize(TextUtils.TruncateAt.END);label.setGravity(Gravity.CENTER);card.addView(label,new LinearLayout.LayoutParams(-1,dp(34)));focus(card);card.setOnClickListener(v->launch(a));card.setOnLongClickListener(v->{appActions(a);return true;});GridLayout.LayoutParams lp=new GridLayout.LayoutParams();lp.width=0;lp.height=dp(104);lp.columnSpec=GridLayout.spec(GridLayout.UNDEFINED,1f);lp.setMargins(dp(5),dp(5),dp(5),dp(5));grid.addView(card,lp);}body.addView(grid,new LinearLayout.LayoutParams(-1,-2));}",
