              " private void section(String title,List<AppItem> entries){body.addView(text(title,22));if(entries.isEmpty()){body.addView(text(\"No applications here yet.\",16));return;}GridLayout grid=new GridLayout(this);grid.setColumnCount(6);grid.setClipChildren(false);grid.setPadding(dp(4),dp(8),dp(4),dp(10));for(AppItem a:entries){LinearLayout card=new LinearLayout(this);card.setGravity(Gravity.CENTER);card.setOrientation(LinearLayout.VERTICAL);card.setPadding(dp(8),dp(8),dp(8),dp(6));card.setBackground(glass(0x443d4e60));card.setContentDescription(a.label);ImageView image=new ImageView(this);image.setScaleType(ImageView.ScaleType.FIT_CENTER);card.addView(image,new LinearLayout.LayoutParams(dp(46),dp(46)));loadIcon(a.pkg,image);TextView label=text(a.label,13);label.setSingleLine(true);label.setEllipsize(TextUtils.TruncateAt.END);label.setGravity(Gravity.CENTER);card.addView(label,new LinearLayout.LayoutParams(-1,dp(34)));focus(card);card.setOnClickListener(v->launch(a));card.setOnLongClickListener(v->{appActions(a);return true;});GridLayout.LayoutParams lp=new GridLayout.LayoutParams();lp.width=0;lp.height=dp(104);lp.columnSpec=GridLayout.spec(GridLayout.UNDEFINED,1f);lp.setMargins(dp(5),dp(5),dp(5),dp(5));grid.addView(card,lp);}body.addView(grid,new LinearLayout.LayoutParams(-1,-2));}",
