              "<project xmlns=\"http://maven.apache.org/POM/4.0.0\"><modelVersion>4.0.0</modelVersion><groupId>dev.mantistv</groupId><artifactId>lint-audit</artifactId><version>1</version><repositories><repository><id>google</id><url>https://dl.google.com/dl/android/maven2/</url></repository><repository><id>central</id><url>https://repo.maven.apache.org/maven2/</url></repository></repositories><dependencies><dependency><groupId>com.android.tools.lint</groupId><artifactId>lint</artifactId><version>31.5.2</version></dependency></dependencies></project>",
