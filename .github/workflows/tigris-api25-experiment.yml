name: Tigris API25 bounded experiment
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mantistv-cloud
  cancel-in-progress: false
jobs:
  audit:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch pinned upstream and apply isolated port
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/tigris-gradle" >> "$GITHUB_ENV"
          git clone https://github.com/lesnolie/Tigris.git experiment
          cd experiment
          git checkout -b mantis/api25-experiment c6d258f467e0a8f68f5a112bb5aef9710e81392d
          python3 - <<'PYCODE'
          import json,base64,zlib,pathlib
          files=json.loads(zlib.decompress(base64.b64decode("")))
          for name,data in files.items():
              p=pathlib.Path(name);assert not p.is_absolute() and '..' not in p.parts
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(data)
          PYCODE
          # No upstream deployment or device workflows in the experimental distribution.
          git rm -r .github/workflows
          git config user.name 'MantisTV Cloud'
          git config user.email 'mantistv-cloud@users.noreply.github.com'
          git add app settings.gradle.kts gradle.properties evaluation TIGRIS-*.md EXPERIMENT-NOTICES.md
          git commit -m 'Experiment: isolate Tigris 2.0.27 and backport API25 runtime gates'
          git rev-parse HEAD > ../SOURCE-COMMIT.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare cloud-only build tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          java -version
          python3 - <<'PYCODE'
          from pathlib import Path
          import urllib.request
          p=Path('experiment/gradle/wrapper/gradle-wrapper.properties')
          checksum=urllib.request.urlopen('https://services.gradle.org/distributions/gradle-9.8.2-bin.zip.sha256',timeout=30).read().decode().strip()
          assert len(checksum)==64
          p.write_text(p.read_text()+'\ndistributionSha256Sum='+checksum+'\n')
          PYCODE
      - name: Test compile and dependency-aware API25 lint
        id: build
        continue-on-error: true
        working-directory: experiment
        run: |
          set -o pipefail
          mkdir -p evaluation/cloud
          env -u GITHUB_REPOSITORY python3 -m unittest discover -s tools -p 'test_*.py' > evaluation/cloud/host-tests.txt 2>&1
          bash tools/test-install.sh > evaluation/cloud/shell-contracts.txt 2>&1
          bash gradlew --no-daemon --max-workers=2 --continue :app:testMantisDebugUnitTest :app:assembleMantisRelease :app:lintMantisDebug 2>&1 | tee evaluation/cloud/build.txt
      - name: Record resolved runtime dependencies
        if: always()
        continue-on-error: true
        working-directory: experiment
        run: |
          bash gradlew --no-daemon --max-workers=2 :app:dependencies --configuration mantisReleaseRuntimeClasspath > evaluation/cloud/dependencies.txt 2>&1
      - name: Collect bounded diagnostic and verified APK evidence
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p dist
          cp SOURCE-COMMIT.txt dist/
          cp experiment/TIGRIS-*.md experiment/EXPERIMENT-NOTICES.md dist/
          cp experiment/evaluation/cloud/*.txt dist/ || true
          find experiment/app/build/reports -name 'lint-results-*.xml' -exec cp {} dist/ \; || true
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,os,xml.etree.ElementTree as ET,zipfile
          libs=[]
          for a in Path(os.environ['GRADLE_USER_HOME']).glob('caches/modules-2/files-2.1/**/*.aar'):
              with zipfile.ZipFile(a) as z:
                  raw=z.read('AndroidManifest.xml') if 'AndroidManifest.xml' in z.namelist() else b''
                  try:
                      node=ET.fromstring(raw).find('uses-sdk'); minimum=node.get('{http://schemas.android.com/apk/res/android}minSdkVersion') if node is not None else None
                  except ET.ParseError: minimum='binary-unparsed'
                  libs.append({'artifact':str(a.relative_to(Path(os.environ['GRADLE_USER_HOME'])/'caches/modules-2/files-2.1')),'minSdk':minimum,'native_entries':[n for n in z.namelist() if n.startswith('jni/') and n.endswith('.so')]})
          Path('dist/AAR-INVENTORY.json').write_text(json.dumps(libs,indent=2)+'\n')
          count=fail=0
          for p in Path('experiment/app/build/test-results').glob('**/TEST-*.xml'):
              e=ET.parse(p).getroot();count+=int(e.get('tests',0));fail+=int(e.get('failures',0))+int(e.get('errors',0))
          Path('dist/RESULT.json').write_text(json.dumps({'build_outcome':os.environ['BUILD_OUTCOME'],'jvm_tests':count,'jvm_failures':fail,'physical_tested':False,'upstream':'c6d258f467e0a8f68f5a112bb5aef9710e81392d','run':os.environ['GITHUB_RUN_ID']},indent=2)+'\n')
          PYCODE
          APK=experiment/app/build/outputs/apk/mantis/release/app-mantis-release.apk
          if test '${{ steps.build.outcome }}' = success && test -f "$APK"; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --min-sdk-version 25 --verbose --print-certs "$APK" > dist/APK-SIGNATURE.txt
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > dist/APK-METADATA.txt
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p 4 "$APK"
            python3 - "$APK" <<'PYCODE'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              bad=[n for n in z.namelist() if n.startswith('lib/') and not n.startswith('lib/armeabi-v7a/')]
              assert not bad,bad
              assert not any('default_intro' in n or 'default_settings_bg' in n for n in z.namelist())
          PYCODE
            cp "$APK" dist/Tigris-Mantis-API25-EXPERIMENT.apk
          fi
          cd experiment
          cp ../dist/RESULT.json evaluation/CLOUD-RESULT.json
          git add evaluation/CLOUD-RESULT.json gradle/wrapper/gradle-wrapper.properties
          git commit -m 'Record bounded cloud evaluation result and pin Gradle checksum'
          git remote add mantis "https://github.com/$GITHUB_REPOSITORY.git"
          git config credential.helper '!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f'
          git push mantis HEAD:refs/heads/experiment/tigris-api25-${{ github.run_id }}
          git rev-parse HEAD > ../dist/EVIDENCE-COMMIT.txt
          cd ../dist
          sha256sum *.txt *.json *.xml *.apk 2>/dev/null > SHA256SUMS.txt || true
          printf 'Experimental source and diagnostic build only. Not hardware verified; do not install. Original MantisTV is unchanged.\n' > RELEASE-NOTES.md
          gh release create "tigris-api25-${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --target "experiment/tigris-api25-${{ github.run_id }}" --prerelease --title 'Tigris API25 technical experiment' --notes-file RELEASE-NOTES.md ./*
          cat RESULT.json >> "$GITHUB_STEP_SUMMARY"
      - name: Require all build gates
        if: always()
        run: test '${{ steps.build.outcome }}' = success
