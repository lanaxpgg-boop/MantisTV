              " private void profiles(){String[] names=new String[4];for(int i=0;i<4;i++)names[i]=prefs.getString(\"name\"+i,\"Profile \"+(i+1));new AlertDialog.Builder(this).setTitle(\"Local profiles\").setSingleChoiceItems(names,Integer.parseInt(profile),(d,which)->{profile=\"\"+which;prefs.edit().putString(\"profile\",profile).apply();d.dismiss();show(\"Home\");}).setNegativeButton(\"Cancel\",null).show();}",
