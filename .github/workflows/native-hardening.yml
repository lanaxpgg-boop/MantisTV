            "scripts/build.sh": [
              "#!/usr/bin/env bash",
              "set -euo pipefail",
              "cd \"$(dirname \"$0\")/..\"",
              "python3 scripts/check-resources.py",
              "SDK=\"${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}\"",
              "BT=\"$SDK/build-tools/34.0.0\"",
              "JAR=\"$SDK/platforms/android-25/android.jar\"",
              "test -f \"$JAR\" && test -x \"$BT/aapt2\"",
              "mkdir -p out/gen out/classes out/dex out/tests releases",
              "javac -proc:none --release 8 -d out/tests app/src/dev/mantistv/home/StoreRules.java tests/StoreRulesTest.java",
              "java -cp out/tests StoreRulesTest | tee out/unit-tests.txt",
              "\"$BT/aapt2\" compile --dir app/res -o out/resources.zip",
              "\"$BT/aapt2\" link -o out/unsigned.apk -I \"$JAR\" --manifest app/AndroidManifest.xml --java out/gen --min-sdk-version 25 --target-sdk-version 25 out/resources.zip",
              "find app/src out/gen -name '*.java' > out/sources.txt",
              "javac -proc:none -encoding UTF-8 --release 8 -Xlint:deprecation -classpath \"$JAR\" -d out/classes @out/sources.txt 2> out/javac-diagnostics.txt",
              "find out/classes -name '*.class' > out/classes.txt",
              "\"$BT/d8\" --release --min-api 25 --lib \"$JAR\" --output out/dex @out/classes.txt",
              "(cd out/dex && zip -q ../unsigned.apk classes.dex)",
              "\"$BT/zipalign\" -f 4 out/unsigned.apk out/aligned.apk",
              "if [ ! -f out/development.keystore ]; then",
              " keytool -genkeypair -keystore out/development.keystore -storepass android -keypass android -alias mantistv -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=MantisTV preview development'",
              "fi",
              "\"$BT/apksigner\" sign --ks out/development.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias mantistv --out releases/MantisTV-0.3.0-preview.apk out/aligned.apk",
              "\"$BT/apksigner\" verify --min-sdk-version 25 --verbose --print-certs releases/MantisTV-0.3.0-preview.apk > releases/signature.txt",
              "\"$BT/aapt\" dump badging releases/MantisTV-0.3.0-preview.apk > releases/manifest.txt",
              "\"$BT/zipalign\" -c 4 releases/MantisTV-0.3.0-preview.apk",
              "python3 - <<'PY'",
              "from pathlib import Path",
              "s=Path('app/AndroidManifest.xml').read_text().replace('package=\"dev.mantistv.home\"','package=\"dev.mantistv.home.debug\"').replace('android:name=\".MainActivity\"','android:name=\"dev.mantistv.home.MainActivity\"').replace('android:label=\"MantisTV\"','android:label=\"MantisTV Debug\"')",
              "Path('out/debug-manifest.xml').write_text(s)",
              "PY",
              "\"$BT/aapt2\" link -o out/debug-unsigned.apk -I \"$JAR\" --manifest out/debug-manifest.xml --min-sdk-version 25 --target-sdk-version 25 --debug-mode out/resources.zip",
              "(cd out/dex && zip -q ../debug-unsigned.apk classes.dex)",
              "\"$BT/zipalign\" -f 4 out/debug-unsigned.apk out/debug-aligned.apk",
              "\"$BT/apksigner\" sign --ks out/development.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias mantistv --out releases/MantisTV-0.3.0-debug.apk out/debug-aligned.apk",
              "\"$BT/apksigner\" verify --min-sdk-version 25 --verbose --print-certs releases/MantisTV-0.3.0-debug.apk > releases/debug-signature.txt",
              "\"$BT/aapt\" dump badging releases/MantisTV-0.3.0-debug.apk > releases/debug-manifest.txt",
              "\"$BT/zipalign\" -c 4 releases/MantisTV-0.3.0-debug.apk",
              "python3 scripts/inspect-apk.py",
              "cp out/unit-tests.txt out/javac-diagnostics.txt releases/",
              "{ echo \"Source commit: $(git rev-parse HEAD)\"; echo 'Package: dev.mantistv.home'; echo 'Debug package: dev.mantistv.home.debug (debuggable; side-by-side test variant)'; echo 'Version: 0.3.0-preview'; echo 'Min SDK: 25; Target SDK: 25; compile SDK: 25'; echo 'No native libraries: DEX-only, compatible in principle with armeabi-v7a'; echo 'Compilation, host unit tests, manifest policy, zip alignment and signature verification: passed'; echo 'Compiled directly against official Android API25 platform; Android lint: NOT RUN'; echo 'Installed or physically tested: NO'; echo 'Signing key: ephemeral development key. Future builds may require uninstall/reinstall; back up local lists first.'; } > releases/BUILD-REPORT.txt",
              "python3 scripts/check-resources.py",
              ""
            ],
            "scripts/inspect-apk.py": [
              "import zipfile, xml.etree.ElementTree as ET",
              "from pathlib import Path",
              "ns='{http://schemas.android.com/apk/res/android}'",
              "r=ET.parse('app/AndroidManifest.xml').getroot()",
              "assert r.attrib['package']=='dev.mantistv.home'",
              "assert r.find('uses-sdk').attrib[ns+'minSdkVersion']=='25'",
              "assert {x.attrib[ns+'name'] for x in r.findall('uses-permission')}=={'android.permission.ACCESS_NETWORK_STATE'}",
              "assert not r.findall('.//service') and not r.findall('.//receiver')",
              "assert not any(x.attrib.get(ns+'name')== 'android.intent.category.HOME' for x in r.findall('.//category'))",
              "p=Path('releases/MantisTV-0.3.0-preview.apk')",
              "with zipfile.ZipFile(p) as z:",
              " assert 'classes.dex' in z.namelist()",
              " assert not any(n.startswith('lib/') for n in z.namelist()), 'Unexpected native ABI dependency'",
              " assert not any(n.endswith(('.keystore','.jks')) for n in z.namelist())",
              " assert z.testzip() is None",
              "badging=Path('releases/manifest.txt').read_text()",
              "assert \"sdkVersion:'25'\" in badging and \"targetSdkVersion:'25'\" in badging",
              "assert \"package: name='dev.mantistv.home'\" in badging",
              "print('PASS: permission policy, non-HOME manifest, no services/receivers, SDK 25 metadata, DEX-only ABI, ZIP integrity')",
              "",
              "with zipfile.ZipFile('releases/MantisTV-0.3.0-debug.apk') as z:",
              " assert 'classes.dex' in z.namelist() and z.testzip() is None",
              " assert not any(n.startswith('lib/') or n.endswith(('.keystore','.jks')) for n in z.namelist())",
              "debug=Path('releases/debug-manifest.txt').read_text()",
              "assert \"package: name='dev.mantistv.home.debug'\" in debug and \"sdkVersion:'25'\" in debug",
              "assert 'application-debuggable' in debug",
              "assert 'application-debuggable' not in badging",
              "print('PASS: debug/release package separation and debuggable flag policy')",
              ""
            ],
            "documentation/INSTALLATION-GUIDE.md": [
              "# Supervised installation",
              "",
              "Do not install unattended. This project has not been physically tested on AFTMM. The baseline reference APK is not the customized MantisTV preview; choose MantisTV-0.3.0-preview.apk from a successful native release.",
              "",
              "1. Verify release checksums against SHA256SUMS.txt on a machine with adequate free storage. Review BUILD-REPORT.txt, signature.txt and manifest.txt.",
              "2. Confirm the device is your AFTMM / Fire OS 6 API 25. Preserve normal Amazon launcher access and record the installed firmware.",
              "3. When you explicitly authorize a supervised device session, enable developer installation/debugging through normal Fire OS controls and use a trusted local network only. Do not expose ADB publicly.",
              "4. From an already provisioned authorized test machine, manually run: adb install MantisTV-0.3.0-preview.apk. No -g, package disabling, HOME remapping or system grants are needed.",
              "5. Launch the MantisTV icon from Amazon Apps, or manually use adb shell am start -n dev.mantistv.home/.MainActivity.",
              "6. Test D-pad reachability and scrolling, app launching/return, favorites, Back exit, Menu controls, profile isolation, search keyboard, unavailable shortcuts and screensaver. Keep the Amazon remote Home button working normally.",
              "7. Observe memory, focus frame consistency, long-session stability and thermal behavior. Stop if the device becomes unstable. Record exact firmware and evidence before classifying compatibility A.",
              "",
              "The preview uses an ephemeral signing key. A later cloud build may not install over it. Never automatically uninstall to fix a signature mismatch: local profiles, favorites and watchlists would be lost.",
              "",
              "For debugging only, MantisTV-0.3.0-debug.apk is a separately packaged debuggable variant (dev.mantistv.home.debug). It can coexist with the preview and keeps separate local data. Its explicit activity is dev.mantistv.home.MainActivity. Use the preview for initial ordinary testing; do not confuse debug and preview packages when launching or uninstalling.",
              ""
            ],
            "documentation/ROLLBACK-GUIDE.md": [
              "# Rollback",
              "",
              "The preview does not become the default HOME, start on boot, disable Amazon packages or change settings automatically. Press the Fire TV remote Home button to return to Amazon, or Back twice from MantisTV Home to exit.",
              "",
              "To remove it, use Fire OS Settings > Applications > Manage Installed Applications > MantisTV > Uninstall. Alternatively, in a separately authorized supervised local test session: adb uninstall dev.mantistv.home.",
              "",
              "Uninstalling deletes MantisTV local profiles, favorites, watchlists and recent-launch history. Review that consequence before uninstalling. No factory reset, firmware restore, root, DNS change or system-package repair is part of rollback.",
              "",
              "The optional debug variant is independently removed via its MantisTV Debug entry or, in an authorized supervised test session, adb uninstall dev.mantistv.home.debug. This deletes only its own local application data.",
              ""
            ],
            "documentation/SYSTEM-ARCHITECTURE.md": [
              "# Architecture",
              "",
              "Stock Fire OS preserves vendor decoding, streaming apps, DRM, HDMI and audio. MantisTV is an ordinary foreground Android Activity; it does not replace protected system components. No root, privileged service, accessibility interceptor, boot receiver or HOME intent filter is present.",
              "",
              "MainActivity implements native View-based TV navigation, explicit app launch and guarded settings shortcuts. AppCatalog independently discovers public PackageManager launch intents; LandscapeView independently renders original artwork and screensaver scenes. StoreRules holds pure history/search logic, independently exercised on the host JVM. SharedPreferences persists four local profiles with bounded recent history, favorites and local watchlists. Application icons are normalized to 96px on one worker thread and cached under a 2 MiB budget. Original landscapes draw with Canvas; screensaver updates stop outside the foreground. No network server or externally accessible control endpoint exists.",
              "",
              "Native resources and SDK tools compile Java to DEX without Gradle, Compose or native libraries. No emulator is needed. Workflows use one standard Ubuntu cloud job, resource gates, timeouts, no dependency caches and GitHub Release delivery.",
              "",
              "Next modules: split UI screens and profile persistence further; add Android lint alongside the existing direct API25 compilation gate; instrumentation tests on supervised hardware; optional receiver app chosen only after license/ABI/security review. Keep protocol integrations out of the UI process.",
              ""
            ],
            "documentation/REPOSITORY-AUDIT.md": [
              "# Repository audit",
              "",
              "## Selected implementation",
              "",
              "Original native Java/View code for a narrow, permission-minimal API 25 preview, on stock Fire OS. No MantisTV runtime dependency or upstream source reuse. Exact MantisTV source commit is recorded in each actual build report.",
              "",
              "## Baseline reference",
              "",
              "https://github.com/techgenius1/tvOS-Launcher at 463fa6c2a9b7322c4407f1d00db935ef09d20f4f. The untouched source compiled using cloud-installed SDK tools; the original build.sh was inspected but not executed. Root license Apache-2.0, third-party Inter OFL and QR MIT notices retained in the baseline archive. Upstream declares min SDK 24 and target 34 in its build script. Its broad manifest requests storage, secure settings, accessibility and notification services; these increase integration and verification scope on stock Fire OS. No physical performance comparison exists.",
              "",
              "## Other candidates, preliminary review only",
              "",
              "- humblemuzzu/dumbtv: advertises reversible Fire TV cleanup over ADB plus a launcher. Device cleanup/package disabling is outside this overnight scope; no code reused.",
              "- petrobot-admin/hume-launcher: advertises tvOS-style launcher and signage. Source/license/API/runtime review incomplete; no code reused.",
              "- hamdalaa/tvhome: Kotlin/Compose launcher and TV features. Added dependency/build footprint requires actual low-RAM measurements; no assumption that Compose is inherently incompatible; no code reused.",
              "- mazer666/PhairPlay: receiver integration research candidate. ARMv7/API25, native dependencies, protocol security and licenses unverified; no inclusion or receiver claim.",
              "- LOSMantis/android_device_amazon_mantis: device tree research candidate, not a ready verified safe firmware replacement. Flashing and bootloader modification are prohibited here.",
              "",
              "Maintenance claims and comparative RAM benchmarks have not been established. This preliminary assessment must be expanded before selecting any additional reuse.",
              "",
              "## Additional source checks (November 10, 2026)",
              "",
              "The public dumbtv root license is MIT and explicitly covers its launcher. Hume's root license is Apache-2.0. tvhome's app/build.gradle.kts declares minSdk 26 and therefore needs real adaptation before API25 use. This is a specific current incompatibility, not a general claim about Kotlin/Compose.",
              "",
              "PhairPlay's app/build.gradle.kts declares a Fire TV minSdk25 flavor and armeabi-v7a among its native targets. Its root license is Apache-2.0, but its CMake path and comments explicitly include a native playfair component. That protected-protocol path is not included in MantisTV and must not be used to bypass content protection. Native dependency and individual component license review remains incomplete. No certification, interoperability or functional receiver claim follows from the manifest/ABI settings.",
              "",
              "Sources: https://raw.githubusercontent.com/humblemuzzu/dumbtv/main/LICENSE ; https://raw.githubusercontent.com/petrobot-admin/hume-launcher/main/LICENSE ; https://raw.githubusercontent.com/hamdalaa/tvhome/main/app/build.gradle.kts ; https://raw.githubusercontent.com/mazer666/PhairPlay/main/app/build.gradle.kts ; https://raw.githubusercontent.com/mazer666/PhairPlay/main/LICENSE . These are execution-time references, not pinned reuse: no code from these projects is embedded.",
              ""
            ],
            "documentation/OS-FOUNDATION-COMPARISON.md": [
              "# Operating system foundation comparison",
              "",
              "| Foundation | Practical benefit | Constraint / evidence | Decision |",
              "|---|---|---|---|",
              "| Stock Fire OS plus ordinary app | Retains vendor apps, DRM stack, decoding and normal recovery path | Foreground app cannot replace protected controls, system launcher or sleep | Selected for initial release |",
              "| Launcher / accessibility / system integration | May provide deeper focus and button behavior | Firmware-dependent grants and broader access; not physically verified | Separate future opt-in review |",
              "| Mantis custom Android / Lineage device tree | More system UI control in principle | Device tree is not proof of a safe ready image; installation requires prohibited bootloader/flash work and could alter DRM/audio support | Research only; no build or installation |",
              "",
              "The baseline launcher was built as a reference, but its system-integration features are not automatically enabled on any device. Original MantisTV has no boot receiver, HOME intent or accessibility service. No bootloader exploit or physical-system modification is part of this implementation.",
              "",
              "LOSMantis reference: https://github.com/LOSMantis/android_device_amazon_mantis . Source/device-tree existence alone does not establish compatible firmware, vendor blobs, security patch state, Widevine certification or recovery reliability. No unsupported official Fire OS major version is claimed for AFTMM.",
              ""
