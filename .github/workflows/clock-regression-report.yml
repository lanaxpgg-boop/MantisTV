      - name: Publish new evidence assets without replacing original APK or checksum files
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin HEAD:main
          mkdir -p qa-release
          cp documentation/CLOCK-PHYSICAL-QA.md qa-release/
          cp device-test/2026-11-10-clock-fix/CLOCK-PHYSICAL-RESULTS.json qa-release/
          git archive --format=zip --output=qa-release/MantisTV-clock-qa-source.zip HEAD
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,os,hashlib
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          result={'compiled_candidate_source':'b6f7a673a01619aca100adbcc4abcf97cbf3ab80','report_commit':head,'candidate_release':'clock-candidate-42842633249','runtime_rebuilt':False,'original_candidate_assets_replaced':False,'physical_report_origin':'Authorized external ADB session on AFTMM NS6711/5908; not reproduced by cloud job','cloud_run':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          Path('qa-release/CLOCK-QA-PUBLICATION.json').write_text(json.dumps(result,indent=2)+'\n')
          release=json.loads(subprocess.check_output(['gh','release','view','clock-candidate-42842633249','--repo',os.environ['GITHUB_REPOSITORY'],'--json','body,assets'],text=True))
          expected={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in Path('qa-release').iterdir()}
          assert not set(expected)&{a['name'] for a in release['assets']},'Evidence asset exists: stop rather than overwrite'
          Path('out').mkdir(exist_ok=True)
          Path('out/clock-updated-release-notes.md').write_text(release['body']+'\n\n## Subsequent physical clock regression — passed\n\nBoth clocks advanced across real minute boundaries on AFTMM/Fire OS6.7.1.1(NS6711/5908):header16:20→16:21; reduced-motion screensaver16:21→16:22. No input or page rebuild during each boundary wait. Pause/resume and Home/double-Back escape passed. Original0.4 APK and its saved watchlist entry were verified unchanged. Candidate retained but stopped after QA; Amazon Home remains default.\n\nSee CLOCK-PHYSICAL-QA.md and CLOCK-PHYSICAL-RESULTS.json for actual tests, performance/log limits and signing/fidelity gaps. New MantisTV-clock-qa-source.zip contains report commit:'+head+'. Original candidate APK/source/checksum assets are preserved; CLOCK-PHYSICAL-QA-SHA256SUMS.txt covers only the added evidence assets. Persistent signing and full tvOS acceptance remain incomplete.\n')
          PY
          (cd qa-release && find . -maxdepth 1 -type f ! -name CLOCK-PHYSICAL-QA-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > CLOCK-PHYSICAL-QA-SHA256SUMS.txt)
          gh release upload clock-candidate-42842633249 qa-release/* --repo "$GITHUB_REPOSITORY"
          gh release edit clock-candidate-42842633249 --repo "$GITHUB_REPOSITORY" --notes-file out/clock-updated-release-notes.md
          cat qa-release/CLOCK-PHYSICAL-QA.md >> "$GITHUB_STEP_SUMMARY"
