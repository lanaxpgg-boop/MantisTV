      - name: Publish report commit and unchanged APKs in an audit prerelease
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin HEAD:main
          python3 - <<'PY'
          import json,os,subprocess,shutil
          from pathlib import Path
          out=Path('out/audit-original');dest=Path('releases')
          for source in out.iterdir():
              name=source.name
              if name=='MantisTV-source.zip':name='MantisTV-original-0.4-source.zip'
              if name=='SHA256SUMS.txt':name='ORIGINAL-SHA256SUMS.txt'
              shutil.copy2(source,dest/name)
          for name in ['PROJECT-PROGRESS.md','STATUS.md']:shutil.copy2(name,dest/name)
          shutil.copy2('documentation/progress-features.json',dest/'progress-features.json')
          verification=json.loads(Path('out/audit-verification.json').read_text())
          verification['existing_host_rule_tests_rerun']='passed; one main, nine checks and one expected-exception scenario; not Android/UI tests'
          (dest/'AUDIT-VERIFICATION.json').write_text(json.dumps(verification,indent=2)+'\n')
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tag='progress-20261110-'+os.environ['GITHUB_RUN_ID']
          publication={'audit_date':'2026-11-10','release_tag':tag,'publication_commit':head,'audited_pre_report_head':os.environ['AUDITED_HEAD'],'original_compiled_app_source':'ab022168a5d8fff173ff0169fd328adb2040be89','application_version':'0.4.0-preview','application_rebuilt':False,'application_bytes_changed':False,'signing_key_regenerated':False,'source_archive_includes_audit_documents':True,'prior_audit_publication_run':42791927564,'prior_publication_failure':'All verification and report commit passed; final release step failed on shell variable scope. Corrected and gates rerun.','cloud_run':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          (dest/'AUDIT-PUBLICATION.json').write_text(json.dumps(publication,indent=2)+'\n')
          notes='Project progress audit, not a new application build.\n\n119 feature/engineering rows: 11 completed/verified (narrow test/tool/artifact scope), 21 implemented but not physically tested, 35 partial, 47 not implemented, 5 blocked. No user-facing TV feature is marked complete from compilation alone.\n\nIncludes PROJECT-PROGRESS.md, updated STATUS, exact feature inventory, fresh artifact/signature/manifest checks, rerun host rules and source ZIP. Existing 0.4 preview/debug APK bytes and signing identity are unchanged. No device installation, hardware performance measurement or Apple ecosystem implementation is claimed.\n\nPublication commit: '+head+'\nOriginal compiled app source: ab022168a5d8fff173ff0169fd328adb2040be89\n'
          Path('out/audit-release-notes.md').write_text(notes)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('AUDIT_TAG='+tag+'\n')
          PY
          AUDIT_TAG="progress-20261110-$GITHUB_RUN_ID"
          git archive --format=zip --output=releases/MantisTV-source.zip HEAD
          (cd releases && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          gh release create "$AUDIT_TAG" releases/* --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease --title 'MantisTV 0.4.0-preview — verified project progress audit' --notes-file out/audit-release-notes.md
          cat out/audit-release-notes.md >> "$GITHUB_STEP_SUMMARY"
