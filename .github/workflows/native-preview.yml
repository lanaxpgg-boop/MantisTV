              " @Override public void onBackPressed(){if(!page.equals(\"Home\")){show(\"Home\");return;}long now=SystemClock.elapsedRealtime();if(now-lastBack<2000){finish();return;}lastBack=now;Toast.makeText(this,\"Press Back again to return to Fire OS\",Toast.LENGTH_SHORT).show();}",
