            "README.md": [
              "# MantisTV",
              "",
              "An independent native Android TV home experience for Amazon Fire TV Stick 4K (2018 / AFTMM). This is an early application preview, not a replacement operating system. No physical Fire TV installation or testing has been performed.",
              "",
              "## Preview functionality",
              "",
              "Home with original procedural landscape artwork; a favorites dock; local recent-launch Top Shelf; app library; package/name search; guarded Control Center shortcuts; local profiles and title watchlists; two appearance palettes; reduce-motion preference; five-minute idle landscape screensaver.",
              "",
              "Use the D-pad and OK. Hold OK on an app for favorites and app information. Menu opens Controls. Back returns Home; press Back twice from Home to exit. Profiles store favorites, recent launches and watchlists separately. Profiles are not parental controls.",
              "",
              "## Build and download",
              "",
              "Cloud workflows use standard Ubuntu GitHub Actions runners in this public repository. No Actions caches or metered artifact uploads are used. Outputs are published as development prerelease assets under Releases. All SDK tools stay in the cloud. Run scripts/build.sh only in a suitably provisioned cloud checkout; it expects existing Android build-tools 34.0.0, platform 34 and a JDK.",
              "",
              "The APK has package dev.mantistv.home, minimum/target SDK 25 and no native libraries. Its source uses native Android APIs and no runtime third-party dependencies. It is development-signed with an ephemeral key; repeated cloud builds are not guaranteed to update an existing installation. It does not register as a HOME replacement or start at boot.",
              "",
              "Read documentation/INSTALLATION-GUIDE.md and documentation/ROLLBACK-GUIDE.md before any supervised test. No automatic installation, ADB connection, system-package changes or firmware changes are part of the build.",
              "",
              "## Evidence",
              "",
              "The untouched upstream reference techgenius1/tvOS-Launcher built at commit 463fa6c2a9b7322c4407f1d00db935ef09d20f4f in a separate baseline run. MantisTV app source is original; no upstream Java, artwork, fonts or third-party libraries are incorporated. The upstream reference keeps its own Apache-2.0 and component license notices in the baseline source release.",
              "",
              "Tests cover local history/search logic and manifest/APK policy. Compilation or SDK metadata is not proof of firmware compatibility or acceptable hardware performance. AirPlay, Apple Remote pairing, provider Continue Watching and Apple certification are not implemented.",
              ""
            ],
            "documentation/INSTALLATION-GUIDE.md": [
              "# Supervised installation",
              "",
              "Do not install unattended. This project has not been physically tested on AFTMM. The baseline reference APK is not the customized MantisTV preview; choose MantisTV-0.1.0-preview.apk from a successful native release.",
              "",
              "1. Verify release checksums against SHA256SUMS.txt on a machine with adequate free storage. Review BUILD-REPORT.txt, signature.txt and manifest.txt.",
              "2. Confirm the device is your AFTMM / Fire OS 6 API 25. Preserve normal Amazon launcher access and record the installed firmware.",
              "3. When you explicitly authorize a supervised device session, enable developer installation/debugging through normal Fire OS controls and use a trusted local network only. Do not expose ADB publicly.",
              "4. From an already provisioned authorized test machine, manually run: adb install MantisTV-0.1.0-preview.apk. No -g, package disabling, HOME remapping or system grants are needed.",
              "5. Launch the MantisTV icon from Amazon Apps, or manually use adb shell am start -n dev.mantistv.home/.MainActivity.",
              "6. Test D-pad reachability and scrolling, app launching/return, favorites, Back exit, Menu controls, profile isolation, search keyboard, unavailable shortcuts and screensaver. Keep the Amazon remote Home button working normally.",
              "7. Observe memory, focus frame consistency, long-session stability and thermal behavior. Stop if the device becomes unstable. Record exact firmware and evidence before classifying compatibility A.",
              "",
              "The preview uses an ephemeral signing key. A later cloud build may not install over it. Never automatically uninstall to fix a signature mismatch: local profiles, favorites and watchlists would be lost.",
              ""
            ],
            "documentation/ROLLBACK-GUIDE.md": [
              "# Rollback",
              "",
              "The preview does not become the default HOME, start on boot, disable Amazon packages or change settings automatically. Press the Fire TV remote Home button to return to Amazon, or Back twice from MantisTV Home to exit.",
              "",
              "To remove it, use Fire OS Settings > Applications > Manage Installed Applications > MantisTV > Uninstall. Alternatively, in a separately authorized supervised local test session: adb uninstall dev.mantistv.home.",
              "",
              "Uninstalling deletes MantisTV local profiles, favorites, watchlists and recent-launch history. Review that consequence before uninstalling. No factory reset, firmware restore, root, DNS change or system-package repair is part of rollback.",
              ""
            ],
            "documentation/KNOWN-ISSUES.md": [
              "# Known issues and limits",
              "",
              "- No physical installation, D-pad usability test, rendering screenshot, memory benchmark or AFTMM performance validation yet.",
              "- Source compilation targets the installed SDK 34 with manifest minimum/target 25. Complete Android lint/API-surface verification remains outstanding; SDK declarations alone are not compatibility evidence.",
              "- Fire OS HOME interception is absent. MantisTV is launched as an ordinary TV app; Amazon remains the system foundation.",
              "- Recent applications reflect MantisTV launches, not privileged OS task enumeration. No task killing or lifecycle control over other applications.",
              "- Top Shelf contains local app history, not protected provider recommendations. Continue Watching is not implemented.",
              "- Landscape artwork is procedural and original, not an aerial video library or Apple artwork. Glass is a lightweight translucent approximation; no real-time blur.",
              "- Controls depend on each firmware's exported settings activities. HDMI audio may be fixed. Sleep uses the normal Fire TV remote only.",
              "- Profiles are local convenience separation, not authentication, parental restrictions or streaming-account switching.",
              "- Search covers installed applications only. No remote content indexes, microphone access or paid APIs.",
              "- AirPlay, FairPlay content, Apple TV remote protocol, Siri, Photos, Music and smart-home pairing are not implemented.",
              "- Development signing keys are ephemeral. A subsequent run may require a separately approved uninstall/reinstall, losing local application data.",
              "- Idle screensaver operates only while MantisTV is in foreground, and cannot replace system sleep/screensaver behavior.",
              ""
            ],
            "documentation/SYSTEM-ARCHITECTURE.md": [
              "# Architecture",
              "",
              "Stock Fire OS preserves vendor decoding, streaming apps, DRM, HDMI and audio. MantisTV is an ordinary foreground Android Activity; it does not replace protected system components. No root, privileged service, accessibility interceptor, boot receiver or HOME intent filter is present.",
              "",
              "MainActivity implements native View-based TV navigation, app discovery via public PackageManager launcher intents, explicit app launch and guarded settings shortcuts. StoreRules holds pure history/search logic, independently exercised on the host JVM. SharedPreferences persists four local profiles with bounded recent history, favorites and local watchlists. Application icons are normalized to 96px on one worker thread and cached under a 2 MiB budget. Original landscapes draw with Canvas; screensaver updates stop outside the foreground. No network server or externally accessible control endpoint exists.",
              "",
              "Native resources and SDK tools compile Java to DEX without Gradle, Compose or native libraries. No emulator is needed. Workflows use one standard Ubuntu cloud job, resource gates, timeouts, no dependency caches and GitHub Release delivery.",
              "",
              "Next modules: split UI screens, profile persistence and package repository into independent classes; add an API-25 SDK compilation/lint gate; instrumentation tests on supervised hardware; optional receiver app chosen only after license/ABI/security review. Keep protocol integrations out of the UI process.",
              ""
            ],
            "documentation/PERFORMANCE-BUDGET.md": [
              "# Performance budget",
              "",
              "These are design constraints and future acceptance targets, not measured results: no always-on service; one icon worker; 2 MiB icon cache; normalized 96px icons; no remote artwork cache; no background networking; 140ms focus animation with reduced-motion fallback; screensaver invalidation limited to 10Hz and foreground operation; no full-screen blur; no native dependencies or emulators.",
              "",
              "Hardware targets: 1.5 GiB RAM / IMG GE8300 / 32-bit ARM / API 25. Measure actual startup, PSS, GC, focus/frame times and return-from-streaming behavior on AFTMM before changing these budgets. 4K output does not imply that every visual should be rendered into a 4K bitmap.",
              "",
              "Use a separately authorized supervised session to capture dumpsys meminfo dev.mantistv.home, gfxinfo and launch timing, avoiding credentials or private viewing history in shared logs. No benchmark numbers are claimed.",
              ""
            ],
