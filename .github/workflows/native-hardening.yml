name: Native release hardening
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mantistv-cloud
  cancel-in-progress: false
jobs:
  quality:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      JAVA_TOOL_OPTIONS: -Xmx768m
    steps:
      - name: Cloud storage gate
        run: |
          python3 - <<'PY'
          import os
          s=os.statvfs(os.environ['GITHUB_WORKSPACE'])
          assert s.f_bavail*s.f_frsize > max(5*1024**3,s.f_blocks*s.f_frsize*.15)+2*1024**3, 'STOP: storage reserve'
          PY
      - name: Checkout public source
        run: git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" project
      - name: Apply original source refinement once
        working-directory: project
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
