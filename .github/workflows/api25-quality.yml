              " private void screensaver(){if(!resumed)return;handler.removeCallbacks(idle);page=\"Screensaver\";Landscape scene=new Landscape(this,true);scene.setFocusable(true);scene.setContentDescription(\"MantisTV landscape screensaver. Press Back to return home.\");setContentView(scene);scene.requestFocus();}",
              " @Override public boolean dispatchKeyEvent(KeyEvent e){if(page.equals(\"Screensaver\")&&e.getAction()==KeyEvent.ACTION_DOWN){show(\"Home\");return true;}if(e.getKeyCode()==KeyEvent.KEYCODE_MENU){if(e.getAction()==KeyEvent.ACTION_DOWN&&e.getRepeatCount()==0)show(page.equals(\"Controls\")?\"Home\":\"Controls\");return true;}return super.dispatchKeyEvent(e);}",
