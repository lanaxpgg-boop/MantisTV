      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare cloud-only tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          java -version
          # The prior evidence commit already pins the official Gradle distribution checksum.
          grep '^distributionSha256Sum=' experiment/gradle/wrapper/gradle-wrapper.properties
      - name: Test compile and lint both experimental variants
        id: build
        continue-on-error: true
        working-directory: experiment
        run: |
          set -o pipefail
          mkdir -p evaluation/cloud-focus-2d61f3c
          node tools/test_phone_i18n.cjs > evaluation/cloud-focus-2d61f3c/phone-tests.txt 2>&1
          env -u GITHUB_REPOSITORY python3 -m unittest discover -s tools -p 'test_*.py' > evaluation/cloud-focus-2d61f3c/host-tests.txt 2>&1
          bash tools/test-install.sh > evaluation/cloud-focus-2d61f3c/shell-contracts.txt 2>&1
          bash gradlew --no-daemon --max-workers=2 --continue :app:testMantisDebugUnitTest :app:testStandardDebugUnitTest :app:testGuardDebugUnitTest :app:assembleStandardDebug :app:assembleGuardDebug :app:assembleMantisRelease :app:lintMantisDebug :app:lintMantisRelease 2>&1 | tee evaluation/cloud-focus-2d61f3c/build.txt
      - name: Verify API25 APK signing metadata and isolation
        id: apk
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p dist
          APK=experiment/app/build/outputs/apk/mantis/release/app-mantis-release.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --min-sdk-version 25 --max-sdk-version 25 --verbose --print-certs "$APK" > dist/APK-SIGNATURE-API25.txt
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > dist/APK-SIGNATURE.txt
          "$TOOLS/aapt" dump badging "$APK" > dist/APK-METADATA.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > dist/APK-MANIFEST.txt
          "$TOOLS/zipalign" -c -p 4 "$APK"
          python3 - "$APK" <<'PYCODE'
          from pathlib import Path
          import sys,json,re,hashlib,zipfile
          p=Path(sys.argv[1]);metadata=Path('dist/APK-METADATA.txt').read_text();manifest=Path('dist/APK-MANIFEST.txt').read_text()
          assert "name='dev.mantistv.tigris.experimental'" in metadata
          assert "sdkVersion:'25'" in metadata and "targetSdkVersion:'31'" in metadata
          assert 'application-debuggable' not in metadata
          assert 'android.intent.category.HOME' not in manifest
          for permission in ['WRITE_SECURE_SETTINGS','SYSTEM_ALERT_WINDOW','PACKAGE_USAGE_STATS','WRITE_SETTINGS','RECEIVE_BOOT_COMPLETED','KILL_BACKGROUND_PROCESSES','REQUEST_INSTALL_PACKAGES','REQUEST_DELETE_PACKAGES']:
              assert 'android.permission.'+permission not in manifest,permission
          for service in ['KeeperService','HomeGuardService','RevivalListener','RevivalSyncService','RevivalAccountService','PhotoDream','UpdateJob','BootReceiver','ConfigReceiver','UpdateResult']:
              assert 'com.leslie.tvhome.'+service not in manifest,service
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              natives=[n for n in z.namelist() if n.endswith('.so')]
              assert not natives,natives
              assert b"optionalAssetDownloads" in z.read("assets/web/index.html")
              assert b"assetUnavailable" in z.read("assets/web/i18n.js")
              assert not any('default_intro' in n or 'default_settings_bg' in n for n in z.namelist())
              dex={n:z.read(n)[:8].decode('ascii') for n in z.namelist() if re.fullmatch(r'classes[0-9]*\.dex',n)}
              assert dex and all(v in ['dex\n035\0','dex\n037\0'] for v in dex.values()),dex
          sig=Path('dist/APK-SIGNATURE.txt').read_text();cert=re.search(r'certificate SHA-256 digest: ([a-f0-9]+)',sig).group(1)
          assert cert!='7d2b6be8a86ce8981e368dde4920869b90c8206137934a6d1fc89a2d1d1b6114'
          result={'package':'dev.mantistv.tigris.experimental','minSDK':25,'targetSDK':31,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'certificate_sha256':cert,'api25_signature_verified':True,'zip_alignment_verified':True,'native_libraries':natives,'dex_headers':dex,'HOME_category':False,'privileged_services_removed':True,'hardware_execution_tested':False,'signing_key_persistence':'ephemeral; safe future updates not established'}
          Path('dist/APK-VERIFICATION.json').write_text(json.dumps(result,indent=2)+'\n')
          PYCODE
          cp "$APK" dist/Tigris-Mantis-focus-2d61f3c-API25.apk
      - name: Publish bounded evidence without device operations
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          APK_OUTCOME: ${{ steps.apk.outcome }}
        run: |
          mkdir -p dist
          cp SOURCE-COMMIT.txt dist/
          cp experiment/PROJECT-RECOVERY-REPORT.md experiment/PROJECT-PROGRESS.md experiment/TECHNICAL-ARCHITECTURE.md dist/
          cp experiment/evaluation/FOCUS-DEMO-CANDIDATE.md dist/
          cp experiment/evaluation/cloud-focus-2d61f3c/*.txt dist/ || true
          find experiment/app/build/reports -name 'lint-results-*.xml' -exec cp {} dist/ \; || true
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,os,xml.etree.ElementTree as ET
          count=fail=0
          by_variant={}
          for p in Path('experiment/app/build/test-results').glob('**/TEST-*.xml'):
              e=ET.parse(p).getroot();count+=int(e.get('tests',0));fail+=int(e.get('failures',0))+int(e.get('errors',0));v=by_variant.setdefault(p.parent.name,{'tests':0,'failures':0});v['tests']+=int(e.get('tests',0));v['failures']+=int(e.get('failures',0))+int(e.get('errors',0))
          reports={}
          for p in Path('dist').glob('lint-results-*.xml'):
              issues=ET.parse(p).getroot().findall('issue');reports[p.name]={'errors':sum(i.get('severity') in ['Error','Fatal'] for i in issues),'warnings':sum(i.get('severity')=='Warning' for i in issues),'new_api_issues':sum(i.get('id')=='NewApi' for i in issues)}
          result={'run':os.environ['GITHUB_RUN_ID'],'build_outcome':os.environ['BUILD_OUTCOME'],'apk_verification_outcome':os.environ['APK_OUTCOME'],'jvm_tests':count,'jvm_failures':fail,'jvm_by_variant':by_variant,'requested_local_commit':json.loads(Path('experiment/evaluation/focus-origin.json').read_text())['local_source_commit'],'lint':reports,'additional_cloud_builds_authorized':1,'additional_cloud_builds_used':1,'physical_tested':False,'Mantis_existing_builds_modified':False}
          Path('dist/RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          if os.environ['BUILD_OUTCOME']!='success' or os.environ['APK_OUTCOME']!='success':
              Path('dist/Tigris-Mantis-focus-2d61f3c-API25.apk').unlink(missing_ok=True)
          PYCODE
          cd experiment
          cp ../dist/RESULT.json evaluation/FOCUS-BUILD-RESULT.json
          if test -f ../dist/APK-VERIFICATION.json; then cp ../dist/APK-VERIFICATION.json evaluation/FOCUS-APK-VERIFICATION.json; fi
          git add evaluation
          git commit -m 'Record single authorized verification build result'
          git remote add verification "https://github.com/$GITHUB_REPOSITORY.git"
          git config credential.helper '!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f'
          git push verification HEAD:refs/heads/experiment/tigris-focus-2d61f3c-${{ github.run_id }}
          git rev-parse HEAD > ../dist/EVIDENCE-COMMIT.txt
          cd ../dist
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib
          paths=sorted(p for p in Path('.').iterdir() if p.is_file())
          Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in paths))
          PYCODE
          printf 'One explicitly authorized free build of the directional focus candidate. Existing Tigris focus and rendering owners reused; exact tvOS fidelity and physical AFTMM performance remain unverified. See FOCUS-DEMO-CANDIDATE.md, RESULT.json and APK-VERIFICATION.json. No device operations; existing Mantis artifacts untouched. Ephemeral signing: safe update continuity remains unresolved.\n' > RELEASE-NOTES.md
          gh release create "tigris-focus-2d61f3c-${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --target "experiment/tigris-focus-2d61f3c-${{ github.run_id }}" --prerelease --title 'Tigris directional focus API25 demonstration candidate' --notes-file RELEASE-NOTES.md ./*
          cat RESULT.json >> "$GITHUB_STEP_SUMMARY"
          if test -f APK-VERIFICATION.json; then cat APK-VERIFICATION.json >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Require build lint and APK verification gates
        if: always()
        run: |
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.apk.outcome }}' = success
