name: MantisTV native preview
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mantistv-cloud
  cancel-in-progress: false
jobs:
  native:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check cloud reserve before checkout
        run: |
          python3 - <<'PY'
          import os
          s=os.statvfs(os.environ['GITHUB_WORKSPACE'])
          assert s.f_bavail*s.f_frsize > max(5*1024**3,s.f_blocks*s.f_frsize*.15)+2*1024**3, 'STOP: insufficient cloud storage'
          PY
      - name: Checkout public project
        run: git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" project
      - name: Seed original source once
        working-directory: project
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=json.loads(r'''{
            "app/AndroidManifest.xml": [
              "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"dev.mantistv.home\" android:versionCode=\"1\" android:versionName=\"0.1.0-preview\"><uses-sdk android:minSdkVersion=\"25\" android:targetSdkVersion=\"25\"/><uses-feature android:name=\"android.hardware.touchscreen\" android:required=\"false\"/><uses-feature android:name=\"android.software.leanback\" android:required=\"false\"/><uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/><application android:label=\"MantisTV\" android:icon=\"@drawable/icon\" android:banner=\"@drawable/banner\" android:theme=\"@android:style/Theme.Material.NoActionBar\" android:allowBackup=\"false\" android:hardwareAccelerated=\"true\"><activity android:name=\".MainActivity\" android:exported=\"true\" android:screenOrientation=\"landscape\" android:launchMode=\"singleTask\"><intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/><category android:name=\"android.intent.category.LEANBACK_LAUNCHER\"/></intent-filter></activity></application></manifest>"
            ],
            "app/res/drawable/icon.xml": [
              "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\" android:width=\"96dp\" android:height=\"96dp\" android:viewportWidth=\"96\" android:viewportHeight=\"96\"><path android:fillColor=\"#102D32\" android:pathData=\"M0,0h96v96h-96z\"/><path android:fillColor=\"#82E9C3\" android:pathData=\"M18,72V24h12l18,26 18,-26h12v48H64V48L48,69 32,48v24z\"/></vector>"
            ],
            "app/res/drawable/banner.xml": [
              "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\" android:width=\"320dp\" android:height=\"180dp\" android:viewportWidth=\"320\" android:viewportHeight=\"180\"><path android:fillColor=\"#102D32\" android:pathData=\"M0,0h320v180h-320z\"/><path android:fillColor=\"#82E9C3\" android:pathData=\"M110,130V50h18l32,44 32,-44h18v80h-20V84l-30,40 -30,-40v46z\"/></vector>"
            ],
            "app/src/dev/mantistv/home/StoreRules.java": [
              "package dev.mantistv.home;",
              "import java.util.*;",
              "public final class StoreRules {",
              " private StoreRules() {}",
              " public static List<String> recent(List<String> previous, String id, int limit) {",
              "  if(limit < 1 || id == null || id.trim().isEmpty()) throw new IllegalArgumentException();",
              "  LinkedHashSet<String> items = new LinkedHashSet<>(); items.add(id);",
              "  for(String item:previous) if(item!=null && !item.isEmpty()) items.add(item);",
              "  List<String> result = new ArrayList<>(); for(String item:items) { if(result.size()==limit)break; result.add(item); } return result;",
              " }",
              " public static boolean matches(String label, String pkg, String query) {",
              "  String q=query.trim().toLowerCase(Locale.ROOT);",
              "  return label.toLowerCase(Locale.ROOT).contains(q)||pkg.toLowerCase(Locale.ROOT).contains(q);",
              " }",
              "}",
              ""
            ],
            "tests/StoreRulesTest.java": [
