name: Upstream baseline build
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mantistv-cloud
  cancel-in-progress: false
jobs:
  baseline:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check resource reserve
        run: |
          python3 - <<'PY'
          import os
          s=os.statvfs(os.environ['GITHUB_WORKSPACE'])
          assert s.f_bavail*s.f_frsize > max(5*1024**3,s.f_blocks*s.f_frsize*.15)+4*1024**3, 'Insufficient cloud disk reserve'
          PY
      - name: Fetch bounded public upstream source
        run: |
          set -euo pipefail
          SIZE=$(gh api repos/techgenius1/tvOS-Launcher --jq .size)
          test "$SIZE" -lt 250000
          SHA=$(gh api repos/techgenius1/tvOS-Launcher/commits/main --jq .sha)
          echo "UPSTREAM_SHA=$SHA" >> "$GITHUB_ENV"
          git init upstream
          git -C upstream remote add origin https://github.com/techgenius1/tvOS-Launcher.git
          git -C upstream -c core.hooksPath=/dev/null fetch --depth 1 origin "$SHA"
          git -C upstream -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          test -f upstream/LICENSE
          test -f upstream/NOTICE
          grep -q 'Apache License' upstream/LICENSE
          test -f upstream/assets/fonts/Inter-LICENSE.txt
          grep -q 'SIL OPEN FONT LICENSE' upstream/assets/fonts/Inter-LICENSE.txt
          grep -R -l 'Permission is hereby granted' upstream/src/io/nayuki/qrcodegen | head
      - name: Compile untouched source using installed Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$SDK/build-tools/34.0.0"
          JAR="$SDK/platforms/android-34/android.jar"
          test -f "$JAR"
          test -x "$BT/aapt2"
          cd upstream
          mkdir -p build/gen build/classes build/dex
          "$BT/aapt2" compile --dir res -o build/res.zip
          "$BT/aapt2" link -o build/unsigned.apk -I "$JAR" --manifest AndroidManifest.xml -A assets --java build/gen --min-sdk-version 24 --target-sdk-version 34 --version-code 10 --version-name 2.1.0 build/res.zip
          find src build/gen -name '*.java' > build/sources.txt
          javac -proc:none -encoding UTF-8 --release 11 -classpath "$JAR" -d build/classes @build/sources.txt
          find build/classes -name '*.class' > build/classes.txt
          "$BT/d8" --release --min-api 24 --lib "$JAR" --output build/dex @build/classes.txt
          (cd build/dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -keystore build/debug.keystore -storepass android -keypass android -alias debug -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=MantisTV upstream baseline development'
          "$BT/apksigner" sign --ks build/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias debug --out build/upstream-baseline.apk build/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs build/upstream-baseline.apk | tee build/signature.txt
          "$BT/aapt" dump badging build/upstream-baseline.apk | tee build/manifest.txt
          echo "BT=$BT" >> "$GITHUB_ENV"
      - name: Package verified baseline and source
        run: |
          set -euo pipefail
          mkdir deliverables
          cp upstream/build/upstream-baseline.apk deliverables/
          cp upstream/build/signature.txt upstream/build/manifest.txt upstream/LICENSE upstream/NOTICE deliverables/
          git -C upstream archive --format=zip --output="$GITHUB_WORKSPACE/deliverables/upstream-source.zip" "$UPSTREAM_SHA"
          printf '%s\n' 'Upstream: techgenius1/tvOS-Launcher' "Commit: $UPSTREAM_SHA" 'Baseline source: unmodified' 'Build: manual SDK commands; original build.sh not executed' 'Signing: ephemeral development key; not update-stable' 'Physical testing: NONE' 'Not MantisTV; do not install unattended' > deliverables/BUILD-REPORT.txt
          (cd deliverables && sha256sum upstream-baseline.apk upstream-source.zip LICENSE NOTICE signature.txt manifest.txt BUILD-REPORT.txt > SHA256SUMS.txt)
          gh release create "baseline-$GITHUB_RUN_ID" deliverables/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Untouched upstream baseline (development only)' --notes-file deliverables/BUILD-REPORT.txt
          cat deliverables/BUILD-REPORT.txt >> "$GITHUB_STEP_SUMMARY"
