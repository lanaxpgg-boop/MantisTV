            "app/src/dev/mantistv/home/HomeGlyph.java": [
              "package dev.mantistv.home;",
              "",
              "import android.content.Context;",
              "import android.graphics.*;",
              "import android.view.View;",
              "",
              "/** Small original line icons; no Apple artwork or font assets. */",
              "final class HomeGlyph extends View {",
              "  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);",
              "  private final Path path = new Path();",
              "  private final int kind;",
              "  HomeGlyph(Context context, int type) {",
              "    super(context); kind = type;",
              "    paint.setColor(Color.WHITE); paint.setStyle(Paint.Style.STROKE);",
              "    paint.setStrokeWidth(2.5f); paint.setStrokeCap(Paint.Cap.ROUND);",
              "    paint.setStrokeJoin(Paint.Join.ROUND);",
              "    if (kind == 3) {",
              "      path.moveTo(21, 17); path.lineTo(43, 17); path.lineTo(43, 49);",
              "      path.lineTo(32, 42); path.lineTo(21, 49); path.close();",
              "    } else if (kind == 5) {",
              "      for (int i = 0; i < 24; i++) {",
              "        double a = i * Math.PI / 12;",
              "        float radius = i % 3 == 0 ? 21 : 17;",
              "        float x = 32 + (float) Math.cos(a) * radius;",
              "        float y = 32 + (float) Math.sin(a) * radius;",
              "        if (i == 0) path.moveTo(x, y); else path.lineTo(x, y);",
              "      }",
              "      path.close();",
              "    }",
              "  }",
              "  @Override protected void onDraw(Canvas c) {",
              "    super.onDraw(c);",
              "    int saved = c.save();",
              "    float size = Math.min(getWidth() * .52f, getHeight() * .70f);",
              "    c.translate((getWidth() - size) / 2, (getHeight() - size) / 2);",
              "    c.scale(size / 64, size / 64);",
              "    switch (kind) {",
              "      case 0:",
              "        for (int y = 0; y < 2; y++) for (int x = 0; x < 3; x++)",
              "          c.drawRoundRect(9 + x * 17, 17 + y * 18, 21 + x * 17, 29 + y * 18, 2, 2, paint);",
              "        break;",
              "      case 1:",
              "        c.drawCircle(28, 28, 15, paint); c.drawLine(39, 39, 53, 53, paint); break;",
              "      case 2:",
              "        c.drawCircle(32, 32, 21, paint); c.drawLine(32, 17, 32, 32, paint);",
              "        c.drawLine(32, 32, 43, 38, paint); break;",
              "      case 3: c.drawPath(path, paint); break;",
              "      case 4:",
              "        c.drawRoundRect(12, 13, 52, 28, 7, 7, paint);",
              "        c.drawRoundRect(12, 36, 52, 51, 7, 7, paint);",
              "        c.drawCircle(23, 20.5f, 3, paint); c.drawCircle(41, 43.5f, 3, paint); break;",
              "      default: c.drawPath(path, paint); c.drawCircle(32, 32, 7, paint);",
              "    }",
              "    c.restoreToCount(saved);",
              "  }",
              "}",
              ""
            ],
            "app/src/dev/mantistv/home/AppCatalog.java": [
              "package dev.mantistv.home;",
              "import android.content.*;",
              "import android.content.pm.*;",
              "import java.util.*;",
              "/** Public launch intents only. No package disabling, task control or privileged queries. */",
              "public final class AppCatalog {",
              "  private AppCatalog() {}",
              "  public static final class AppItem {",
              "    public final String pkg, label;",
              "    public final Intent intent;",
              "    AppItem(String p, String l, Intent i) {",
              "      pkg = p;",
              "      label = l;",
              "      intent = i;",
              "    }",
              "  }",
              "  public static List<AppItem> discover(Context context) {",
              "    ArrayList<AppItem> result = new ArrayList<>();",
              "    HashSet<String> seen = new HashSet<>();",
              "    PackageManager pm = context.getPackageManager();",
              "    for (String category :",
              "        new String[] {Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER}) {",
              "      List<ResolveInfo> candidates;",
              "      try {",
              "        candidates =",
              "            pm.queryIntentActivities(new Intent(Intent.ACTION_MAIN).addCategory(category), 0);",
              "      } catch (SecurityException unavailable) {",
              "        continue;",
              "      }",
              "      for (ResolveInfo r : candidates) {",
              "        if (r.activityInfo == null || !r.activityInfo.exported || !r.activityInfo.enabled)",
              "          continue;",
              "        String pkg = r.activityInfo.packageName;",
              "        if (pkg.equals(context.getPackageName()) || pkg.equals(\"dev.mantistv.home\")",
              "            || pkg.startsWith(\"dev.mantistv.home.\") || !seen.add(pkg))",
              "          continue;",
              "        CharSequence label;",
              "        try {",
              "          label = r.loadLabel(pm);",
              "        } catch (RuntimeException unavailable) {",
              "          label = pkg;",
              "        }",
              "        Intent launch = new Intent(Intent.ACTION_MAIN)",
              "                            .addCategory(category)",
              "                            .setComponent(new ComponentName(pkg, r.activityInfo.name))",
              "                            .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK",
              "                                | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);",
              "        result.add(new AppItem(pkg, label == null ? pkg : label.toString(), launch));",
              "      }",
              "    }",
              "    Collections.sort(result, (a, b) -> a.label.compareToIgnoreCase(b.label));",
              "    return result;",
              "  }",
              "}",
              ""
            ],
            "app/src/dev/mantistv/home/StoreRules.java": [
              "package dev.mantistv.home;",
              "import java.util.*;",
              "public final class StoreRules {",
              "  private StoreRules() {}",
              "  public static List<String> homeOrder(List<String> installed, List<String> favorites,",
              "      List<String> preferred, boolean favoritesSaved) {",
              "    LinkedHashSet<String> available = new LinkedHashSet<>(installed);",
              "    LinkedHashSet<String> ordered = new LinkedHashSet<>();",
              "    for (String pkg : favorites) if (available.contains(pkg)) ordered.add(pkg);",
              "    if (!favoritesSaved)",
              "      for (String pkg : preferred) if (available.contains(pkg)) ordered.add(pkg);",
              "    ordered.addAll(available);",
              "    return new ArrayList<>(ordered);",
              "  }",
              "  public static String profileId(String id) {",
              "    return \"1\".equals(id) || \"2\".equals(id) || \"3\".equals(id) ? id : \"0\";",
              "  }",
              "  public static List<String> recent(List<String> previous, String id, int limit) {",
              "    if (limit < 1 || id == null || id.trim().isEmpty())",
              "      throw new IllegalArgumentException();",
              "    LinkedHashSet<String> items = new LinkedHashSet<>();",
              "    items.add(id);",
              "    for (String item : previous)",
              "      if (item != null && !item.isEmpty())",
              "        items.add(item);",
              "    List<String> result = new ArrayList<>();",
              "    for (String item : items) {",
              "      if (result.size() == limit)",
              "        break;",
              "      result.add(item);",
              "    }",
              "    return result;",
              "  }",
              "  public static boolean matches(String label, String pkg, String query) {",
              "    String q = query.trim().toLowerCase(Locale.ROOT);",
              "    return label.toLowerCase(Locale.ROOT).contains(q) || pkg.toLowerCase(Locale.ROOT).contains(q);",
              "  }",
              "}",
              ""
            ],
            "tests/StoreRulesTest.java": [
              "import dev.mantistv.home.StoreRules;",
              "import java.util.*;",
              "public class StoreRulesTest {",
              "  static void check(boolean ok) {",
              "    if (!ok)",
              "      throw new AssertionError();",
              "  }",
              "  public static void main(String[] args) {",
              "    check(StoreRules.recent(Arrays.asList(\"a\", \"b\", \"a\", \"c\"), \"b\", 3)",
              "              .equals(Arrays.asList(\"b\", \"a\", \"c\")));",
              "    check(StoreRules.recent(Arrays.asList(\"a\", \"b\"), \"c\", 1).equals(Arrays.asList(\"c\")));",
              "    List<String> values = Arrays.asList(\"a\", \"b\");",
              "    StoreRules.recent(values, \"c\", 3);",
              "    check(values.equals(Arrays.asList(\"a\", \"b\")));",
              "    check(StoreRules.matches(\"Apple TV\", \"com.apple.atve\", \" APPLE \"));",
              "    check(StoreRules.matches(\"TV\", \"com.example.player\", \"PLAYER\"));",
              "    check(!StoreRules.matches(\"TV\", \"com.example\", \"music\"));",
              "    try {",
              "      StoreRules.recent(values, \"x\", 0);",
              "      throw new AssertionError();",
              "    } catch (IllegalArgumentException expected) {",
              "    }",
              "    check(StoreRules.profileId(null).equals(\"0\"));",
              "    check(StoreRules.profileId(\"999\").equals(\"0\"));",
              "    check(StoreRules.profileId(\"3\").equals(\"3\"));",
              "    List<String> installed = Arrays.asList(\"a\", \"b\", \"c\", \"a\");",
              "    check(StoreRules.homeOrder(installed, Arrays.asList(\"c\", \"missing\", \"c\"),",
              "              Arrays.asList(\"b\"), true).equals(Arrays.asList(\"c\", \"a\", \"b\")));",
              "    check(StoreRules.homeOrder(installed, Collections.emptyList(), Arrays.asList(\"b\"), false)",
              "              .equals(Arrays.asList(\"b\", \"a\", \"c\")));",
              "    check(StoreRules.homeOrder(installed, Collections.emptyList(), Arrays.asList(\"b\"), true)",
              "              .equals(Arrays.asList(\"a\", \"b\", \"c\")));",
              "    check(installed.equals(Arrays.asList(\"a\", \"b\", \"c\", \"a\")));",
              "    check(StoreRules.homeOrder(Collections.emptyList(), Arrays.asList(\"stale\"),",
              "              Arrays.asList(\"b\"), false).isEmpty());",
              "    System.out.println(\"PASS: profile bounds, history ordering, deduplication, bounds, \"",
              "        + \"immutability, search normalization and Home ordering/explicit-empty favorites\");",
              "  }",
              "}",
              ""
            ],
            "scripts/build.sh": [
              "#!/usr/bin/env bash",
              "set -euo pipefail",
              "cd \"$(dirname \"$0\")/..\"",
              "python3 scripts/check-resources.py",
              "SDK=\"${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}\"",
              "BT=\"$SDK/build-tools/34.0.0\"",
              "JAR=\"$SDK/platforms/android-25/android.jar\"",
              "test -f \"$JAR\" && test -x \"$BT/aapt2\"",
              "mkdir -p out/gen out/classes out/dex out/tests releases",
              "javac -proc:none --release 8 -d out/tests app/src/dev/mantistv/home/StoreRules.java tests/StoreRulesTest.java",
              "java -cp out/tests StoreRulesTest | tee out/unit-tests.txt",
              "\"$BT/aapt2\" compile --dir app/res -o out/resources.zip",
              "\"$BT/aapt2\" link -o out/unsigned.apk -I \"$JAR\" --manifest app/AndroidManifest.xml --java out/gen --min-sdk-version 25 --target-sdk-version 25 out/resources.zip",
              "find app/src out/gen -name '*.java' > out/sources.txt",
              "javac -proc:none -encoding UTF-8 --release 8 -Xlint:deprecation -classpath \"$JAR\" -d out/classes @out/sources.txt 2> out/javac-diagnostics.txt",
              "find out/classes -name '*.class' > out/classes.txt",
              "\"$BT/d8\" --release --min-api 25 --lib \"$JAR\" --output out/dex @out/classes.txt",
              "(cd out/dex && zip -q ../unsigned.apk classes.dex)",
              "\"$BT/zipalign\" -f 4 out/unsigned.apk out/aligned.apk",
              "if [ ! -f out/development.keystore ]; then",
              " keytool -genkeypair -keystore out/development.keystore -storepass android -keypass android -alias mantistv -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=MantisTV preview development'",
              "fi",
              "\"$BT/apksigner\" sign --ks out/development.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias mantistv --out releases/MantisTV-0.5.0-preview.apk out/aligned.apk",
              "\"$BT/apksigner\" verify --min-sdk-version 25 --verbose --print-certs releases/MantisTV-0.5.0-preview.apk > releases/signature.txt",
              "\"$BT/aapt\" dump badging releases/MantisTV-0.5.0-preview.apk > releases/manifest.txt",
              "\"$BT/zipalign\" -c 4 releases/MantisTV-0.5.0-preview.apk",
              "python3 - <<'PY'",
              "from pathlib import Path",
              "s=Path('app/AndroidManifest.xml').read_text().replace('package=\"dev.mantistv.home\"','package=\"dev.mantistv.home.design\"').replace('android:name=\".MainActivity\"','android:name=\"dev.mantistv.home.MainActivity\"').replace('android:label=\"MantisTV\"','android:label=\"MantisTV Home Preview\"')",
              "Path('out/debug-manifest.xml').write_text(s)",
              "PY",
              "\"$BT/aapt2\" link -o out/debug-unsigned.apk -I \"$JAR\" --manifest out/debug-manifest.xml --min-sdk-version 25 --target-sdk-version 25 --debug-mode out/resources.zip",
              "(cd out/dex && zip -q ../debug-unsigned.apk classes.dex)",
              "\"$BT/zipalign\" -f 4 out/debug-unsigned.apk out/debug-aligned.apk",
              "\"$BT/apksigner\" sign --ks out/development.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias mantistv --out releases/MantisTV-0.5.0-design.apk out/debug-aligned.apk",
              "\"$BT/apksigner\" verify --min-sdk-version 25 --verbose --print-certs releases/MantisTV-0.5.0-design.apk > releases/debug-signature.txt",
              "\"$BT/aapt\" dump badging releases/MantisTV-0.5.0-design.apk > releases/debug-manifest.txt",
              "\"$BT/zipalign\" -c 4 releases/MantisTV-0.5.0-design.apk",
              "python3 scripts/inspect-apk.py",
              "cp out/unit-tests.txt out/javac-diagnostics.txt releases/",
              "{ echo \"Source commit: $(git rev-parse HEAD)\"; echo 'Package: dev.mantistv.home'; echo 'Debug package: dev.mantistv.home.design (debuggable; side-by-side test variant)'; echo 'Version: 0.5.0-preview'; echo 'Min SDK: 25; Target SDK: 25; compile SDK: 25'; echo 'No native libraries: DEX-only, compatible in principle with armeabi-v7a'; echo 'Compilation, host unit tests, manifest policy, zip alignment and signature verification: passed'; echo 'Compiled directly against official Android API25 platform; lint is a separate pipeline stage'; echo 'Installed or physically tested: NO'; echo 'Signing key: ephemeral development key. Certificate continuity is not established. Preserve existing installations; never automatically uninstall to bypass a mismatch. Use the separate design package for candidate QA.'; } > releases/BUILD-REPORT.txt",
              "python3 scripts/check-resources.py",
              ""
            ],
            "scripts/inspect-apk.py": [
              "import zipfile, xml.etree.ElementTree as ET",
              "from pathlib import Path",
              "ns='{http://schemas.android.com/apk/res/android}'",
              "r=ET.parse('app/AndroidManifest.xml').getroot()",
              "assert r.attrib['package']=='dev.mantistv.home'",
              "assert r.find('uses-sdk').attrib[ns+'minSdkVersion']=='25'",
              "assert {x.attrib[ns+'name'] for x in r.findall('uses-permission')}=={'android.permission.ACCESS_NETWORK_STATE'}",
              "assert not r.findall('.//service') and not r.findall('.//receiver')",
              "assert not any(x.attrib.get(ns+'name')== 'android.intent.category.HOME' for x in r.findall('.//category'))",
              "p=Path('releases/MantisTV-0.5.0-preview.apk')",
              "with zipfile.ZipFile(p) as z:",
              " assert 'classes.dex' in z.namelist()",
              " assert not any(n.startswith('lib/') for n in z.namelist()), 'Unexpected native ABI dependency'",
              " assert not any(n.endswith(('.keystore','.jks')) for n in z.namelist())",
              " assert z.testzip() is None",
              "badging=Path('releases/manifest.txt').read_text()",
              "assert \"versionCode='6'\" in badging and \"versionName='0.5.0-preview'\" in badging",
              "assert \"sdkVersion:'25'\" in badging and \"targetSdkVersion:'25'\" in badging",
              "assert \"package: name='dev.mantistv.home'\" in badging",
              "print('PASS: permission policy, non-HOME manifest, no services/receivers, SDK 25 metadata, DEX-only ABI, ZIP integrity')",
              "",
              "with zipfile.ZipFile('releases/MantisTV-0.5.0-design.apk') as z:",
              " assert 'classes.dex' in z.namelist() and z.testzip() is None",
              " assert not any(n.startswith('lib/') or n.endswith(('.keystore','.jks')) for n in z.namelist())",
              "debug=Path('releases/debug-manifest.txt').read_text()",
              "assert \"versionCode='6'\" in debug and \"versionName='0.5.0-preview'\" in debug",
              "assert \"package: name='dev.mantistv.home.design'\" in debug and \"sdkVersion:'25'\" in debug",
              "assert 'application-debuggable' in debug",
              "assert 'application-debuggable' not in badging",
              "print('PASS: debug/release package separation and debuggable flag policy')",
              ""
            ],
            "documentation/HOME-PREVIEW-PLAN.md": [
              "# 0.5.0 Home composition preview",
              "",
              "## Scope and reference",
              "",
              "This is the first visible Home redesign toward maximum feasible1:1 latest-tvOS acceptance. It preserves the0.4/0.4.1 installed baselines. It does not establish full tvOS fidelity or Apple ecosystem functionality.",
              "",
              "Current primary visual reference inspected November10,2026: [Apple TV4K page](https://www.apple.com/apple-tv-4k/) and its [Home image](https://www.apple.com/v/apple-tv-4k/ap/images/overview/welcome/hero__fwxqo8gh62ye_large.jpg). The image shows a six-app row low on the screen with another row peeking below, large artwork above and focused-card emphasis. This is a marketing perspective image without an explicit tvOS patch-version label, so it cannot establish pixel-exact27.2 geometry. Earlier frontal tvOS26 reference remains separately versioned in TVOS-DESIGN-SPEC.md. Detailed Home guide fetch again returned429; no bypass was used.",
              "",
              "## Implemented source slice, awaiting gates",
              "",
              "- Full-bleed installed-app banner/gradient backdrop and spatial six-column app grid; old greeting hero and seven page tabs removed from Home.",
              "- App focus updates real installed-app title/banner and an actual Open target. No invented movie posters, Continue Watching progress or provider Top Shelf feed.",
              "- Bottom app row begins near72% viewport height, with another row partially visible; vertical scrolling reveals functional Library/Search/Recent/Watchlist/Controls/Settings tiles and remaining apps.",
              "- Existing local favorites order the grid; unused/stale/duplicate app IDs are filtered. Explicitly saved empty favorites no longer apply default preferred ordering. Host tests cover default/saved/empty/stale/duplicate/immutability cases.",
              "- Directional focus IDs, no row wrapping, focus scale/tilt/layer translation, reduced-motion branch, and Home focus restoration after app/page return.180ms/1.10scale are provisional implementation values, not measured Apple timings or achieved hardware latency.",
              "- Original vector-style line glyphs, native live clock/profile entry and actual palette preference. No Apple artwork/fonts bundled.",
              "- Initial duplicate discovery/page rebuild removed; debounce/cancel pending hero-art requests and reject stale banners. Existing icon cache shared; Home tiles rasterize installed resources, hero bitmap bounded768\u00d7432. Actual PSS/frame behavior must be measured.",
              "",
              "Supporting pages retain their existing UI until later reconstruction. App launch, profile preferences and saved lists remain real existing functions. Native Apple Remote/AirPlay/HomeKit/media protocols are not implemented by this design change; see APPLE-ECOSYSTEM-PLAN.md.",
              "",
              "## Delivery and physical gates",
              "",
              "Version0.5.0-preview/code6. Package dev.mantistv.home.design is a separately debuggable Home Preview; preserve original dev.mantistv.home0.4 and dev.mantistv.home.debug0.4.1. Ephemeral signing does not establish future upgrade continuity. Never uninstall or clear an app to bypass a certificate mismatch.",
              "",
              "Build only on free standard public cloud runners: API25 compilation, updated host rule tests, seven selected lint checks, manifest/version/SDK/ABI/ZIP/alignment/signature inspection. Verify exact source/APK/certificate/checksums before any isolated design APK installation. No local build/SDK/cache downloads, paid service, root/flash/default-launcher/system-package/network-setting change.",
              "",
              "Actual AFTMM acceptance must inspect Home composition/focus bounds/screenshots, no Home page tabs, directional movement/edge behavior, Home-to-utility-to-Home restoration, explicit app launch-return, clock, reduced motion, profile/palette behavior, working Watchlist/Recent access, app/process return and Amazon Home escape. Capture PSS/frame/log observations without claiming sustained/native4K acceptance. Report observed failures and fidelity deviations; a successful build is not a UI pass.",
              ""
            ],
            "documentation/TVOS-DESIGN-SPEC.md": [
              "# Definitive tvOS recreation design specification",
              "",
              "Updated2026-11-10 during the existing physical QA run. This specification supersedes any interpretation that a generic Android launcher with glass styling is the final product. Preserve the installed0.4 APK, existing commits/artifacts and completed tests. **Target: maximum feasible1:1 recreation of the latest publicly documented Apple tvOS experience, with working behavior behind every visible action.** Current 0.4 fails final visual and behavioral acceptance.",
              "",
              "## Reference baseline and provenance",
              "",
              "Latest version verified in Apple's [software update summary](https://support.apple.com/en-ie/106336):tvOS 27.2. Retrieved2026-11-10; version-specific features remain in the119-row inventory. Versioned reference evidence must name OS/version, device, region, display dimensions, focus state and capture date. Never describe an older screenshot as a verified27.2 screen.",
              "",
              "Actual Apple images visually inspected this run:",
              "",
              "- [Home/Top Shelf official Newsroom image](https://www.apple.com/newsroom/images/2025/06/apple-tv-brings-a-beautiful-redesign-and-enhanced-home-entertainment-experience/article/Apple-WWDC25-tvOS-26-hero-250609_big.jpg.large.jpg), from [Apple's June9,2025 tvOS 26 announcement](https://www.apple.com/newsroom/2025/06/apple-tv-brings-a-beautiful-redesign-and-enhanced-home-entertainment-experience/). The TV image shows content artwork dominating the upper surface, a lower app row, a visible continuation below, and small status/profile elements. This is an inherited26 reference, not proof of unchanged27.2 geometry.",
              "- [Official App Switcher image](https://help.apple.com/assets/699FDE58256A5007AE03F37E/699FDE5CCBA706658D03FBAF/en_US/566edba5db029d047bb1667bed0cf13a.png), linked by [Apple's Switch between apps guide](https://support.apple.com/guide/tv/switch-between-apps-atvbbcec4f4e/tvos). Visually inspected: overlapping horizontal windows, centered preview and neighboring cards with app identity. The retrieved guide identifies tvOS 26; do not assign27.2 pixel accuracy to this asset.",
              "",
              "Other primary references: [Apple TV guide](https://support.apple.com/guide/tv/welcome/tvos), [layout HIG](https://developer.apple.com/design/human-interface-guidelines/layout), [layered images/parallax](https://developer.apple.com/design/human-interface-guidelines/images), [Liquid Glass platform guidance](https://developer.apple.com/documentation/TechnologyOverviews/adopting-liquid-glass), and [remote guide](https://cdsassets.apple.com/live/6GJYWVAV/user/apple-tv-remote.pdf). Apple Newsroom also links official Controls, player and TV-app poster videos; these were located, not downloaded or frame-measured. Several detailed guide fetches returned429. Full27.2 screen-state/animation reference coverage therefore remains open. No inferred pixel coordinates, animation curves or font equivalence are presented as measured facts.",
              "",
              "Reference media is for comparison; it has not been bundled as redistributable application artwork. Record license/source for each shipping font, icon, poster, video and candidate component. Use legally reusable assets and metrically close typography where exact fonts/assets are unavailable; record each fidelity deviation explicitly.",
              "",
              "## Screen-by-screen acceptance and present gap",
              "",
              "| Surface | Required acceptance | Actual0.4 evidence/gap | Next implementation slice |",
              "|---|---|---|---|",
              "| Home | Match reference content hierarchy, Top Shelf/app-row proportions, margins, type scale, icon shapes and directional navigation across focused/unfocused/scrolled states | Device screenshots show seven page-navigation buttons, procedural hero and generic grid. Visual acceptance fails | Replace page-tab scaffold with a reference-measured Home scene; preserve app catalog/launch/store logic behind adapters |",
              "| Top Shelf | Focus-dependent genuine content/artwork, valid launch/resume behavior and consistent shelf-to-app navigation | Recent app list only; no content feed or viewing progress | Define provider adapter and permitted content metadata/deep links; no invented Continue Watching cards |",
              "| App Library | Match the observed Apple app organization/ordering/focus states; every shown installed app opens its real target | Discovery/launch tested; generic six-column catalog, incomplete semantic filters, icon fallback | Capture current version's app arrangement states; bounded original/installed icons; model reordering/folders only when real persistence exists |",
              "| Control Center | Reference overlay placement, tabs/tiles, background treatment, selection and subpanel transitions; each setting invokes a supported real capability | Full-page button list; network/display info tested, settings/volume effects unverified; no global access | Foreground overlay with capability-backed tiles and return-to-context. Global access remains a separate unresolved platform requirement |",
