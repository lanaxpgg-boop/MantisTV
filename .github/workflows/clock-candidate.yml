              apk=Path('releases/MantisTV-0.4.1-'+name+'.apk')
              cert=re.search(r'certificate SHA-256 digest: ([0-9a-f]+)',Path('releases/'+report).read_text()).group(1)
              assert len(cert)==64
              variants[name]={'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'bytes':apk.stat().st_size,'certificate_sha256':cert,'package':'dev.mantistv.home'+('.debug' if name=='debug' else '')}
          assert variants['preview']['certificate_sha256']==variants['debug']['certificate_sha256']
          assert variants['preview']['certificate_sha256']!='84c0078a6f74ddf42cc3a3b2705906bf302cbc6478665649af52a8211995dbd1','Review unexpected old-key continuity before publication'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          result={'version':'0.4.1-preview','version_code':5,'source_commit':head,'baseline_commit':'ac6f70e5bf47827e81c7332d12def8d108907071','original_0_4_installed_app_preserved':True,'cloud_build_passed':True,'existing_host_rule_tests_passed':True,'selected_seven_rule_lint_passed':True,'physical_regression_status':'not yet run','persistent_signing':False,'in_place_update_of_original_0_4_supported':False,'variants':variants,'run_url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          Path('releases/CLOCK-CANDIDATE-VERIFICATION.json').write_text(json.dumps(result,indent=2)+'\n')
          Path('releases/CLOCK-FIX-CANDIDATE.md').write_text(Path('documentation/CLOCK-FIX-CANDIDATE.md').read_text())
          Path('out/clock-release-notes.md').write_text('0.4.1 clock regression candidate, not final tvOS design.\n\nFixes live Home/header clock and minute-boundary reduced-motion screensaver redraw. API25 compilation, existing host rules, seven selected lint rules, APK metadata/ABI/ZIP/alignment/signatures passed. Physical clock regression has NOT yet run.\n\nThe original0.4 APK uses a different unavailable signing key. Do not uninstall it or clear data to install this candidate. Use only the separate dev.mantistv.home.debug package for isolated QA; new development signatures remain ephemeral, so this is not update-stable production signing. No device commands run in this workflow.\n\nSource commit:'+head+'\n\nIncludes exact candidate APKs, source, checksums, signature/manifest/lint reports and regression plan. Maximum feasible1:1 latest tvOS remains the product target; this increment fixes defects in the preserved baseline UI.\n')
          PY
          gh auth setup-git
          git push origin HEAD:main
          git archive --format=zip --output=releases/MantisTV-source.zip HEAD
          cp LICENSE documentation/INSTALLATION-GUIDE.md documentation/ROLLBACK-GUIDE.md releases/
          (cd releases && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          gh release create "clock-candidate-$GITHUB_RUN_ID" releases/* --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease --title 'MantisTV 0.4.1 — clock regression candidate' --notes-file out/clock-release-notes.md
          cat out/clock-release-notes.md >> "$GITHUB_STEP_SUMMARY"
