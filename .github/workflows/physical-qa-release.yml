      - name: Publish unchanged verified APKs and sanitized physical report
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin HEAD:main
          python3 - <<'PY'
          import json,os,subprocess,shutil,hashlib
          from pathlib import Path
          out=Path('out/audit-original');dest=Path('releases')
          for source in out.iterdir():
              name=source.name
              if name=='MantisTV-source.zip':name='MantisTV-original-0.4-source.zip'
              if name=='SHA256SUMS.txt':name='ORIGINAL-SHA256SUMS.txt'
              shutil.copy2(source,dest/name)
          for name in ['PROJECT-PROGRESS.md','STATUS.md']:shutil.copy2(name,dest/name)
          for name in ['progress-features.json','TVOS-DESIGN-SPEC.md']:shutil.copy2('documentation/'+name,dest/name)
          device=Path('device-test/2026-11-10')
          for name in ['DEVICE-TEST-REPORT.md','PHYSICAL-COMPATIBILITY.md','PERFORMANCE-REPORT.md','LOCAL-EVIDENCE-INDEX.json','FINAL-SAFETY-CHECK.json']:shutil.copy2(device/name,dest/name)
          verification=json.loads(Path('out/audit-verification.json').read_text())
          verification.update(existing_host_rule_tests_rerun=True,exact_certificate_pinned=True,device_evidence_origin='External authorized ADB session on one AFTMM NS6711/5908; cloud job does not reproduce it',private_raw_device_evidence_uploaded=False)
          (dest/'PHYSICAL-QA-VERIFICATION.json').write_text(json.dumps(verification,indent=2)+'\n')
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tag='physical-qa-20261110-'+os.environ['GITHUB_RUN_ID']
          publication={'release_tag':tag,'publication_commit':head,'original_compiled_app_source':'ab022168a5d8fff173ff0169fd328adb2040be89','application_version':'0.4.0-preview','application_rebuilt':False,'application_bytes_changed':False,'signing_key_regenerated':False,'physical_test_target':'AFTMM/mantis FireOS6.7.1.1 NS6711/5908 API25 armeabi-v7a','full_product_acceptance':False,'source_archive_includes_reports_and_specification':True,'cloud_run':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          (dest/'PHYSICAL-QA-PUBLICATION.json').write_text(json.dumps(publication,indent=2)+'\n')
          notes='Physical QA and definitive tvOS recreation specification; unchanged0.4 application, not a redesigned build.\n\nExact target:AFTMM/mantis, FireOS6.7.1.1(NS6711/5908), API25/ARMv7. Normal installation/basic navigation, app launch-return, search, recent history, local watchlist/profile isolation/process persistence and manual/real-idle screensaver exercised. Two clock defects confirmed; automated long-press actions failed and physical held-remote acceptance remains open. Full tvOS fidelity, all-firmware/media/Apple integration and long-soak acceptance are incomplete.\n\n119rows:22narrow completed/verified,4implemented but not physically tested,45partial,46not implemented,2blocked. Functional smoke passes do not establish visual fidelity. Includes exact reports, measured performance limits, Apple reference provenance, design specification, backlog and next10tasks. Raw personal device inventory/images/logs remain private.\n\nExisting APK bytes/certificate reverified, no signing key regenerated or device update required. Publication commit:'+head+'\nOriginal compiled source:ab022168a5d8fff173ff0169fd328adb2040be89\n'
          Path('out/physical-release-notes.md').write_text(notes)
          PY
          git archive --format=zip --output=releases/MantisTV-source.zip HEAD
          (cd releases && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          gh release create "physical-qa-20261110-$GITHUB_RUN_ID" releases/* --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease --title 'MantisTV 0.4 preview — AFTMM physical QA and tvOS design specification' --notes-file out/physical-release-notes.md
          cat out/physical-release-notes.md >> "$GITHUB_STEP_SUMMARY"
