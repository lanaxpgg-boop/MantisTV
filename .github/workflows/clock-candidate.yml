            "scripts/build.sh": [
              "#!/usr/bin/env bash",
              "set -euo pipefail",
              "cd \"$(dirname \"$0\")/..\"",
              "python3 scripts/check-resources.py",
              "SDK=\"${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}\"",
              "BT=\"$SDK/build-tools/34.0.0\"",
              "JAR=\"$SDK/platforms/android-25/android.jar\"",
              "test -f \"$JAR\" && test -x \"$BT/aapt2\"",
              "mkdir -p out/gen out/classes out/dex out/tests releases",
              "javac -proc:none --release 8 -d out/tests app/src/dev/mantistv/home/StoreRules.java tests/StoreRulesTest.java",
              "java -cp out/tests StoreRulesTest | tee out/unit-tests.txt",
              "\"$BT/aapt2\" compile --dir app/res -o out/resources.zip",
              "\"$BT/aapt2\" link -o out/unsigned.apk -I \"$JAR\" --manifest app/AndroidManifest.xml --java out/gen --min-sdk-version 25 --target-sdk-version 25 out/resources.zip",
              "find app/src out/gen -name '*.java' > out/sources.txt",
              "javac -proc:none -encoding UTF-8 --release 8 -Xlint:deprecation -classpath \"$JAR\" -d out/classes @out/sources.txt 2> out/javac-diagnostics.txt",
              "find out/classes -name '*.class' > out/classes.txt",
              "\"$BT/d8\" --release --min-api 25 --lib \"$JAR\" --output out/dex @out/classes.txt",
              "(cd out/dex && zip -q ../unsigned.apk classes.dex)",
              "\"$BT/zipalign\" -f 4 out/unsigned.apk out/aligned.apk",
              "if [ ! -f out/development.keystore ]; then",
              " keytool -genkeypair -keystore out/development.keystore -storepass android -keypass android -alias mantistv -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=MantisTV preview development'",
              "fi",
              "\"$BT/apksigner\" sign --ks out/development.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias mantistv --out releases/MantisTV-0.4.1-preview.apk out/aligned.apk",
              "\"$BT/apksigner\" verify --min-sdk-version 25 --verbose --print-certs releases/MantisTV-0.4.1-preview.apk > releases/signature.txt",
              "\"$BT/aapt\" dump badging releases/MantisTV-0.4.1-preview.apk > releases/manifest.txt",
              "\"$BT/zipalign\" -c 4 releases/MantisTV-0.4.1-preview.apk",
              "python3 - <<'PY'",
              "from pathlib import Path",
              "s=Path('app/AndroidManifest.xml').read_text().replace('package=\"dev.mantistv.home\"','package=\"dev.mantistv.home.debug\"').replace('android:name=\".MainActivity\"','android:name=\"dev.mantistv.home.MainActivity\"').replace('android:label=\"MantisTV\"','android:label=\"MantisTV Debug\"')",
              "Path('out/debug-manifest.xml').write_text(s)",
              "PY",
              "\"$BT/aapt2\" link -o out/debug-unsigned.apk -I \"$JAR\" --manifest out/debug-manifest.xml --min-sdk-version 25 --target-sdk-version 25 --debug-mode out/resources.zip",
              "(cd out/dex && zip -q ../debug-unsigned.apk classes.dex)",
              "\"$BT/zipalign\" -f 4 out/debug-unsigned.apk out/debug-aligned.apk",
              "\"$BT/apksigner\" sign --ks out/development.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias mantistv --out releases/MantisTV-0.4.1-debug.apk out/debug-aligned.apk",
              "\"$BT/apksigner\" verify --min-sdk-version 25 --verbose --print-certs releases/MantisTV-0.4.1-debug.apk > releases/debug-signature.txt",
              "\"$BT/aapt\" dump badging releases/MantisTV-0.4.1-debug.apk > releases/debug-manifest.txt",
              "\"$BT/zipalign\" -c 4 releases/MantisTV-0.4.1-debug.apk",
              "python3 scripts/inspect-apk.py",
              "cp out/unit-tests.txt out/javac-diagnostics.txt releases/",
              "{ echo \"Source commit: $(git rev-parse HEAD)\"; echo 'Package: dev.mantistv.home'; echo 'Debug package: dev.mantistv.home.debug (debuggable; side-by-side test variant)'; echo 'Version: 0.4.1-preview'; echo 'Min SDK: 25; Target SDK: 25; compile SDK: 25'; echo 'No native libraries: DEX-only, compatible in principle with armeabi-v7a'; echo 'Compilation, host unit tests, manifest policy, zip alignment and signature verification: passed'; echo 'Compiled directly against official Android API25 platform; lint is a separate pipeline stage'; echo 'Installed or physically tested: NO'; echo 'Signing key: ephemeral development key. Certificate continuity is not established. Preserve existing installations; never automatically uninstall to bypass a mismatch. Use the separate debug package for candidate QA.'; } > releases/BUILD-REPORT.txt",
              "python3 scripts/check-resources.py",
              ""
            ],
            "scripts/inspect-apk.py": [
              "import zipfile, xml.etree.ElementTree as ET",
              "from pathlib import Path",
              "ns='{http://schemas.android.com/apk/res/android}'",
              "r=ET.parse('app/AndroidManifest.xml').getroot()",
              "assert r.attrib['package']=='dev.mantistv.home'",
              "assert r.find('uses-sdk').attrib[ns+'minSdkVersion']=='25'",
              "assert {x.attrib[ns+'name'] for x in r.findall('uses-permission')}=={'android.permission.ACCESS_NETWORK_STATE'}",
              "assert not r.findall('.//service') and not r.findall('.//receiver')",
              "assert not any(x.attrib.get(ns+'name')== 'android.intent.category.HOME' for x in r.findall('.//category'))",
              "p=Path('releases/MantisTV-0.4.1-preview.apk')",
              "with zipfile.ZipFile(p) as z:",
              " assert 'classes.dex' in z.namelist()",
              " assert not any(n.startswith('lib/') for n in z.namelist()), 'Unexpected native ABI dependency'",
              " assert not any(n.endswith(('.keystore','.jks')) for n in z.namelist())",
              " assert z.testzip() is None",
              "badging=Path('releases/manifest.txt').read_text()",
              "assert \"versionCode='5'\" in badging and \"versionName='0.4.1-preview'\" in badging",
              "assert \"sdkVersion:'25'\" in badging and \"targetSdkVersion:'25'\" in badging",
              "assert \"package: name='dev.mantistv.home'\" in badging",
              "print('PASS: permission policy, non-HOME manifest, no services/receivers, SDK 25 metadata, DEX-only ABI, ZIP integrity')",
              "",
              "with zipfile.ZipFile('releases/MantisTV-0.4.1-debug.apk') as z:",
              " assert 'classes.dex' in z.namelist() and z.testzip() is None",
              " assert not any(n.startswith('lib/') or n.endswith(('.keystore','.jks')) for n in z.namelist())",
              "debug=Path('releases/debug-manifest.txt').read_text()",
              "assert \"versionCode='5'\" in debug and \"versionName='0.4.1-preview'\" in debug",
              "assert \"package: name='dev.mantistv.home.debug'\" in debug and \"sdkVersion:'25'\" in debug",
              "assert 'application-debuggable' in debug",
              "assert 'application-debuggable' not in badging",
              "print('PASS: debug/release package separation and debuggable flag policy')",
              ""
            ],
            "documentation/CLOCK-FIX-CANDIDATE.md": [
              "# 0.4.1 clock-fix candidate",
              "",
              "Source changes: the header uses Android TextClock, preserving HH:mm, text size and padding; the screensaver schedules its next reduced-motion redraw at the next real minute boundary, refreshes the timezone on each changed minute, and exposes its clock text as an accessibility description. Normal motion retains its existing100ms redraw request. These changes do not reconstruct Home or establish tvOS fidelity.",
              "",
              "Version0.4.1-preview/code5. Existing API25/ARMv7/no-services/non-HOME/permission policy retained. Cloud gates: actual API25 compilation, existing host rule tests, selected seven-rule zero-warning lint, packaged version/SDK/debug/ABI/ZIP/alignment and cryptographic signature checks. These gates alone do not verify clock behavior.",
              "",
