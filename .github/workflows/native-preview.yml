              " private Button button(String label,Runnable action){Button b=new Button(this);b.setText(label);b.setTextColor(Color.WHITE);b.setTextSize(14);b.setAllCaps(false);b.setPadding(dp(16),dp(6),dp(16),dp(6));b.setBackground(glass(0x443d4e60));focus(b);b.setOnClickListener(v->action.run());return b;}",
