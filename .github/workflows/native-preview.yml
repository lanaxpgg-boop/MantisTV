name: MantisTV native preview
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mantistv-cloud
  cancel-in-progress: false
jobs:
  native:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check cloud reserve before checkout
        run: |
          python3 - <<'PY'
          import os
          s=os.statvfs(os.environ['GITHUB_WORKSPACE'])
          assert s.f_bavail*s.f_frsize > max(5*1024**3,s.f_blocks*s.f_frsize*.15)+2*1024**3, 'STOP: insufficient cloud storage'
          PY
      - name: Checkout public project
        run: git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" project
      - name: Ensure official API25 platform in cloud (no automatic license acceptance)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -f "$SDK/platforms/android-25/android.jar" ]; then
            MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
            test -n "$MANAGER"
            "$MANAGER" --sdk_root="$SDK" 'platforms;android-25' < /dev/null
          fi
          test -f "$SDK/platforms/android-25/android.jar"
      - name: Compile and verify native preview
        working-directory: project
        run: |
          if ! bash scripts/build.sh; then
            test ! -f out/javac-diagnostics.txt || cat out/javac-diagnostics.txt
            exit 1
          fi
      - name: Publish APK, source and checksums as free release assets
        working-directory: project
        run: |
          set -euo pipefail
          git archive --format=zip --output=releases/MantisTV-source.zip HEAD
          cp LICENSE documentation/INSTALLATION-GUIDE.md documentation/ROLLBACK-GUIDE.md releases/
          (cd releases && sha256sum *.apk *.zip *.txt *.md LICENSE > SHA256SUMS.txt)
          gh release create "preview-$GITHUB_RUN_ID" releases/* --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease --title 'MantisTV 0.2.0 API25 development preview' --notes-file releases/BUILD-REPORT.txt
          cat releases/BUILD-REPORT.txt >> "$GITHUB_STEP_SUMMARY"
