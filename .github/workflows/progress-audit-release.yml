            "documentation/TVOS-FEATURE-MATRIX.md": [
              "# tvOS feature matrix \u2014 audited November 10, 2026",
              "",
              "The authoritative expanded matrix is [PROJECT-PROGRESS.md](../PROJECT-PROGRESS.md#3-feature-inventory), with [machine-readable inventory](progress-features.json). It covers all original mission feature groups plus documented tvOS27/27.2 and relevant inherited design/ecosystem features. Each of 119 distinct rows has exactly one of the five requested statuses. Shared features across screens are counted once.",
              "",
              "No user-facing TV feature is marked Completed and verified from compilation or documentation. Current totals: 11 narrow engineering/test/artifact rows completed and verified; 21 implemented but not physically tested; 35 partial; 47 not implemented; 5 blocked. These are row counts, not effort-weighted progress percentages.",
              "",
              "Original app remains 0.4.0-preview. There is no physical AFTMM acceptance, verified per-firmware compatibility, hardware benchmark, Apple protocol implementation or full OS replacement. See the report for source methods, test scope, exact artifact hashes and next ten tasks.",
              "",
              "Apple reference: https://support.apple.com/en-us/106336 and https://support.apple.com/en-us/149524 . Earlier November 10 retrieval identified tvOS27.2, released October26,2026; an audit refresh was throttled, so no newer undocumented claims are inferred.",
              ""
            ],
            "documentation/BUILD-REPORT.md": [
              "# Build evidence \u2014 corrected by progress audit",
              "",
              "Latest actual application build is 0.4.0-preview, code4, package dev.mantistv.home plus separate debuggable dev.mantistv.home.debug. Minimum/target/compile SDK25; DEX-only and no native library payload. Compiled source: ab022168a5d8fff173ff0169fd328adb2040be89. Original release target/source archive: 54619013a18b723559520e6d32241dc56909d7c7, a subsequent documentation checkpoint. Successful original build/lint run: 42747779541. Audited pre-report HEAD: a1a51fe520363c2512eb14a79e4c17998c8ad0ad; its app source is unchanged.",
              "",
              "Compilation, narrow host data-rule tests, manifest/package/ZIP/ABI policy, alignment and development signatures passed. Seven selected Android lint checks had zero errors/warnings; no full lint sweep or Android/hardware instrumentation ran. Physical installation/testing and performance measurements remain absent.",
              "",
              "The progress audit release is documentation-only: it republishes the identical, reverified 0.4 APKs and includes PROJECT-PROGRESS, STATUS, source ZIP and machine-readable provenance/verification. It does not build a new version, generate a new signing key or alter old release assets. Fresh signatures/manifests and rerun host rules are separate audit evidence; original build reports are retained unchanged.",
              "",
              "No persistent private production keystore is configured. Ephemeral development signing is not update-stable. Untouched upstream baseline techgenius1/tvOS-Launcher at 463fa6c2a9b7322c4407f1d00db935ef09d20f4f is a separate Apache-2.0 reference release, not code embedded in the original MIT-licensed MantisTV app. See ../PROJECT-PROGRESS.md for the full evidence audit.",
              ""
            ],
            "documentation/QA-REPORT.md": [
              "# QA report \u2014 audited November 10, 2026",
              "",
              "Actual source test suite: tests/StoreRulesTest.java is one host-JVM main with nine direct check calls and one expected-invalid-limit exception scenario. It covers recent ordering/deduplication/bounds, input immutability, normalized label/package search and profile-ID fallback. It does not test Android profiles/persistence/isolation, UI navigation, app launch, controls, idle timing, playback or lifecycle behavior.",
              "",
              "Original 0.4 cloud run 42747779541 passed API25 compilation, manifest/ZIP/ABI policy, separate debug package/flag policy, zip alignment and development signature verification. Actual lint.txt says No issues found; lint.xml has no issue entries. Scope is exactly NewApi, InlinedApi, MissingPermission, WrongThread, HandlerLeak, DrawAllocation and StaticFieldLeak, from Maven lint31.5.2 (reported CLI lint8.5.2). The earlier 0.3 audit had six drawing-allocation warnings; it was not a clean lint result. No claim of all available lint rules is made.",
              "",
              "The progress audit independently read current source/history and original artifact bytes, verified APK/source ZIP hashes and CRCs, and checked selected source ZIP files against current code. Its cloud publication gate additionally checks all old asset hashes, runtime input provenance, actual packaged manifests, SDK25-floor signatures/alignment and reruns the host rule suite. Outcomes and scope are in AUDIT-VERIFICATION.json and audit-prefixed release reports; old results remain labeled as old results.",
              "",
              "There is no installed package/device log, screenshot, Android instrumentation, measured AFTMM performance, long-session soak, firmware-specific API/service/package proof or DRM/playback acceptance. All firmware catalog rows are C. Source-review UX issues are recorded in ../PROJECT-PROGRESS.md, with no claim they have been reproduced physically. Device remains untouched; supervised testing requires separate authorization.",
              ""
            ],
            "documentation/KNOWN-ISSUES.md": [
              "# Known issues \u2014 audited November 10, 2026",
              "",
              "- No physical AFTMM installation, TV visual QA, D-pad/keyboard test, Android persistence/isolation test, hardware benchmark or soak test.",
              "- API25 source compilation and seven selected lint checks passed for 0.4. A complete lint sweep, vendor API/service verification and real firmware compatibility are outstanding.",
              "- Empty saved favorites repopulate the Home dock with default apps. Source-inferred; not physically reproduced.",
              "- Reduced-motion screensaver has no periodic invalidate for its clock; the header clock is created on page construction. Time display can become stale absent other redraw/reconstruction. Source-inferred.",
              "- Focus tags are package-based and can duplicate between Dock and Top Shelf; rebuilt pages do not preserve library filter/search input/scroll state. Source-inferred.",
              "- Startup invokes synchronous discovery in onCreate and onResume. Icon executor queue/stale work is not explicitly bounded/canceled. Total PSS is not bounded by the 2MiB cache cap. No hardware regression/performance measurement exists.",
              "- MantisTV is a foreground app, not default HOME/system UI. No boot receiver, accessibility service, global overlay, OS task snapshots/killing, app-driven sleep or system screensaver replacement.",
