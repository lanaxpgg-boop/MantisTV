              " private void controls(){body.addView(text(\"Control Center\",26));ConnectivityManager cm=(ConnectivityManager)getSystemService(CONNECTIVITY_SERVICE);NetworkInfo net=cm.getActiveNetworkInfo();body.addView(text(net!=null&&net.isConnected()?\"Network · \"+net.getTypeName():\"Network · disconnected\",17));android.util.DisplayMetrics m=new android.util.DisplayMetrics();getWindowManager().getDefaultDisplay().getRealMetrics(m);body.addView(text(\"Display · \"+m.widthPixels+\" × \"+m.heightPixels+\" · \"+getWindowManager().getDefaultDisplay().getRefreshRate()+\" Hz\",17));AudioManager audio=(AudioManager)getSystemService(AUDIO_SERVICE);body.addView(button(\"Volume down\",()->volume(audio,-1)));body.addView(button(\"Volume up\",()->volume(audio,1)));body.addView(text(\"HDMI and TV volume may require your TV remote.\",14));body.addView(button(\"Network settings\",()->safe(new Intent(Settings.ACTION_WIFI_SETTINGS))));body.addView(button(\"Sound settings\",()->safe(new Intent(Settings.ACTION_SOUND_SETTINGS))));body.addView(button(\"Display settings\",()->safe(new Intent(Settings.ACTION_DISPLAY_SETTINGS))));body.addView(button(\"Screensaver\",()->screensaver()));body.addView(text(\"System sleep remains controlled by the Fire TV remote. No privileged power commands are used.\",14));}",
