name: Publish physical QA and tvOS design report
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mantistv-cloud
  cancel-in-progress: false
jobs:
  audit:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JAVA_TOOL_OPTIONS: -Xmx768m
      AUDITED_HEAD: a1a51fe520363c2512eb14a79e4c17998c8ad0ad
      ORIGINAL_RELEASE: quality-42747779541
    steps:
      - name: Check cloud resources before small artifact audit
        run: |
          python3 - <<'PY'
          import os
          s=os.statvfs(os.environ['GITHUB_WORKSPACE'])
          assert s.f_bavail*s.f_frsize > max(5*1024**3,s.f_blocks*s.f_frsize*.15)+1024**3, 'STOP: insufficient cloud reserve'
          PY
      - name: Checkout public repository and guard audited runtime
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" project
          git -C project fetch --depth 1 origin "$AUDITED_HEAD"
          git -C project fetch --depth 1 origin 0b1dbeda5a3358744bafb4a952878bc133f6bfd9
          git -C project diff --exit-code "$AUDITED_HEAD" HEAD -- app scripts tests
      - name: Verify original assets, source archive and checksums without rebuilding APKs
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ORIGINAL_RELEASE" > /tmp/mantistv-original-release.json
          python3 - <<'PY'
          import json, urllib.request, hashlib, zipfile, io, subprocess
          from pathlib import Path
          release=json.loads(Path('/tmp/mantistv-original-release.json').read_text())
          out=Path('out/audit-original');out.mkdir(parents=True,exist_ok=True)
          assets={}
          for asset in release['assets']:
              assert asset['size'] < 2*1024*1024, 'Unexpected large asset: stop and review'
              name=asset['name']
              assert Path(name).name==name and name not in ('','.','..')
              with urllib.request.urlopen(asset['browser_download_url'],timeout=30) as r:data=r.read(2*1024*1024+1)
              assert len(data)<=2*1024*1024
              digest=hashlib.sha256(data).hexdigest()
              assert asset.get('digest')=='sha256:'+digest, name+' GitHub digest mismatch'
              assert len(data)==asset['size'], name+' size mismatch'
              (out/name).write_bytes(data)
              assets[name]={'sha256':digest,'bytes':len(data),'original_url':asset['browser_download_url']}
          assert len(assets)==18, 'Original release asset inventory changed; review before publishing'
          expected_apks={'MantisTV-0.4.0-preview.apk':'6cc7dfe086518130770c7ceae6397d3ba1fd1dc8f1bd6a9efc00b2f5b12e30e4','MantisTV-0.4.0-debug.apk':'447a8a7e72a3fa1965c99f41b3d0e3f8f1e591831266259198ede41b1a360c1e'}
          for name,digest in expected_apks.items():
              assert assets[name]['sha256']==digest
              with zipfile.ZipFile(out/name) as z:
                  assert z.testzip() is None
                  assert 'classes.dex' in z.namelist()
                  assert not any(n.startswith('lib/') or n.endswith(('.jks','.keystore')) for n in z.namelist())
          for line in (out/'SHA256SUMS.txt').read_text().splitlines():
              digest,name=line.split(None,1);name=name.removeprefix('./')
              assert assets[name]['sha256']==digest, name+' checksum-file mismatch'
          assert assets['MantisTV-source.zip']['sha256']=='8a8516b03b15ffa338acc77e85243d56da5506b41674caab620d45ada0be8cfa'
          runtime=subprocess.check_output(['git','ls-files','app','scripts','tests'],text=True).splitlines()
          with zipfile.ZipFile(out/'MantisTV-source.zip') as z:
              assert z.testzip() is None
              for name in runtime:assert z.read(name)==Path(name).read_bytes(), name+' differs from original source archive'
          Path('out/audit-verification.json').write_text(json.dumps({'original_release':release['tag_name'],'original_compiled_source':'ab022168a5d8fff173ff0169fd328adb2040be89','asset_count':len(assets),'all_original_asset_hashes_verified':True,'runtime_input_files_compared':runtime,'runtime_matches_original_source_archive':True,'assets':assets},indent=2)+'\n')
          print('PASS: all 18 original asset digests/checksums; both APK ZIP policies; all tracked runtime/build/test inputs match original source ZIP')
          PY
      - name: Independently verify actual SDK25-floor APK signatures, alignment and manifest metadata
        working-directory: project
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$SDK/build-tools/34.0.0"
          mkdir -p releases
          for variant in preview debug; do
            APK="out/audit-original/MantisTV-0.4.0-$variant.apk"
            "$BT/apksigner" verify --min-sdk-version 25 --verbose --print-certs "$APK" > "releases/AUDIT-$variant-signature.txt"
            "$BT/zipalign" -c 4 "$APK"
            "$BT/aapt" dump badging "$APK" > "releases/AUDIT-$variant-manifest.txt"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          for variant,pkg in [('preview','dev.mantistv.home'),('debug','dev.mantistv.home.debug')]:
              text=Path('releases/AUDIT-'+variant+'-manifest.txt').read_text()
              assert "package: name='"+pkg+"'" in text
              assert "versionName='0.4.0-preview'" in text
              assert "sdkVersion:'25'" in text and "targetSdkVersion:'25'" in text
              assert ('application-debuggable' in text)==(variant=='debug')
              permissions=[line for line in text.splitlines() if line.startswith('uses-permission:')]
              assert permissions==["uses-permission: name='android.permission.ACCESS_NETWORK_STATE'"]
          data=json.loads(Path('out/audit-verification.json').read_text())
          data.update(fresh_sdk25_floor_signature_verification=True,fresh_zip_alignment_verification=True,fresh_packaged_manifest_verification=True,cloud_job_performed_device_testing=False,external_device_report="device-test/2026-11-10/DEVICE-TEST-REPORT.md")
          Path('out/audit-verification.json').write_text(json.dumps(data,indent=2)+'\n')
          print('PASS: fresh actual APK signature, alignment, SDK/package/debug/permission metadata verification; no device installation')
          PY
      - name: Rerun only the existing host data-rule tests in cloud
        working-directory: project
        run: |
          mkdir -p out/audit-tests
          javac -proc:none --release 8 -d out/audit-tests app/src/dev/mantistv/home/StoreRules.java tests/StoreRulesTest.java
          java -cp out/audit-tests StoreRulesTest | tee releases/AUDIT-unit-tests.txt
      - name: Save sanitized reports and validate the feature inventory
