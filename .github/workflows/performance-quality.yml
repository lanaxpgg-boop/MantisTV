            "scripts/lint.sh": [
              "#!/usr/bin/env bash",
              "set -euo pipefail",
              "cd \"$(dirname \"$0\")/..\"",
              "python3 scripts/check-resources.py",
              ": \"${RUNNER_TEMP:?Cloud runner required}\"",
              "SDK=\"${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}\"",
              "mkdir -p out/lint releases",
              "mvn -B -q -f tests/lint-pom.xml -Dmaven.repo.local=\"$RUNNER_TEMP/mantistv-maven\" org.apache.maven.plugins:maven-dependency-plugin:3.6.1:copy-dependencies -DincludeScope=runtime -DoutputDirectory=\"$PWD/out/lint\"",
              "java -cp 'out/lint/*' com.android.tools.lint.Main --version",
              "java -cp 'out/lint/*' com.android.tools.lint.Main --sdk-home \"$SDK\" --compile-sdk-version 25 --java-language-level 8 --sources app/src --resources app/res --classpath \"$SDK/platforms/android-25/android.jar\" --check NewApi,InlinedApi,MissingPermission,WrongThread,HandlerLeak,DrawAllocation,StaticFieldLeak -Werror --xml releases/lint.xml --text releases/lint.txt --exitcode app",
              "python3 - <<'PY'",
              "from pathlib import Path",
              "import xml.etree.ElementTree as ET",
              "issues=ET.parse('releases/lint.xml').getroot().findall('issue')",
              "assert not issues, 'Selected Android lint checks must be warning/error free'",
              "with Path('releases/BUILD-REPORT.txt').open('a') as report:",
              " report.write('Android lint 31.5.2: NewApi, InlinedApi, MissingPermission, WrongThread, HandlerLeak, DrawAllocation, StaticFieldLeak: 0 errors, 0 warnings. Other lint checks and hardware instrumentation not run.\\n')",
              "print('PASS: selected Android lint gate has zero issues')",
              "PY",
              ""
            ],
            "documentation/PERFORMANCE-BUDGET.md": [
              "# Performance budget",
              "",
              "These are design constraints and future acceptance targets, not measured results: no always-on service; one icon worker; 2 MiB icon cache; normalized 96px icons; no remote artwork cache; no background networking; 140ms focus animation with reduced-motion fallback; screensaver invalidation limited to 10Hz and foreground operation; no full-screen blur; no native dependencies or emulators.",
              "",
              "Hardware targets: 1.5 GiB RAM / IMG GE8300 / 32-bit ARM / API 25. Measure actual startup, PSS, GC, focus/frame times and return-from-streaming behavior on AFTMM before changing these budgets. 4K output does not imply that every visual should be rendered into a 4K bitmap.",
              "",
              "Use a separately authorized supervised session to capture dumpsys meminfo dev.mantistv.home, gfxinfo and launch timing, avoiding credentials or private viewing history in shared logs. No benchmark numbers are claimed.",
              "",
              "## Measured static finding and source correction",
              "",
              "Android lint 31.5.2 reported six DrawAllocation warnings in the 0.3 renderer, with zero errors in the selected API/permission/thread/lifecycle checks (run 42747404342). The 0.4 renderer prebuilds its gradient and four mountain paths on size changes, reuses a formatter and Date, and updates clock text only when its minute changes. Static checks are rerun with warnings promoted to errors. These are source-level allocation improvements, not measured frame-rate or RAM benchmarks.",
              ""
