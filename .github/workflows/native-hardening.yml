              " public static void main(String[] args){",
              "  check(StoreRules.recent(Arrays.asList(\"a\",\"b\",\"a\",\"c\"),\"b\",3).equals(Arrays.asList(\"b\",\"a\",\"c\")));",
              "  check(StoreRules.recent(Arrays.asList(\"a\",\"b\"),\"c\",1).equals(Arrays.asList(\"c\")));",
              "  List<String> values=Arrays.asList(\"a\",\"b\"); StoreRules.recent(values,\"c\",3); check(values.equals(Arrays.asList(\"a\",\"b\")));",
