              " private void launch(AppItem a){try{startActivity(a.intent);save(\"recent\",StoreRules.recent(list(\"recent\"),a.pkg,12));}catch(ActivityNotFoundException|SecurityException e){Toast.makeText(this,\"This app is unavailable. Refresh Library or open Fire OS settings.\",Toast.LENGTH_LONG).show();}}",
              " private void appActions(AppItem a){boolean fav=list(\"favorites\").contains(a.pkg);new AlertDialog.Builder(this).setTitle(a.label).setItems(new String[]{fav?\"Remove from favorites\":\"Add to favorites\",\"Application information\"},(d,n)->{if(n==0){ArrayList<String> items=list(\"favorites\");if(fav)items.remove(a.pkg);else if(items.size()<24)items.add(a.pkg);save(\"favorites\",items);show(page);}else safe(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,Uri.parse(\"package:\"+a.pkg)));}).show();}",
