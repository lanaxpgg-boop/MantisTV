              "  body.addView(text(\"Menu: controls    Hold OK on an app: favorites and app info    Back: Home / exit\",12));View restored=root.findViewWithTag(desired);if(restored!=null)restored.requestFocus();else nav.getChildAt(0).requestFocus();armIdle();",
              " }",
