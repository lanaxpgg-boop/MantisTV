      - name: Catalog public firmware metadata only (no firmware downloads)
        continue-on-error: true
        working-directory: project
        run: python3 scripts/catalog-firmware.py
      - name: Format Java using existing cloud tool when available
        working-directory: project
        run: |
          if command -v clang-format >/dev/null; then
            find app/src tests -name '*.java' -exec clang-format --style=Google -i {} +
          fi
      - name: Checkpoint source and audit evidence
        working-directory: project
        run: |
          git config user.name 'MantisTV cloud build'
          git config user.email 'mantistv@users.noreply.github.com'
          git add app scripts tests documentation device README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Preallocate scene geometry and enforce API25 Android lint gate'
            gh auth setup-git
            git push origin HEAD:main
          fi
      - name: Ensure official API25 platform in cloud (no automatic license acceptance)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -f "$SDK/platforms/android-25/android.jar" ]; then
            MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
            test -n "$MANAGER"
            "$MANAGER" --sdk_root="$SDK" 'platforms;android-25' < /dev/null
          fi
          test -f "$SDK/platforms/android-25/android.jar"
      - name: Build against Android API25 and verify APK
        working-directory: project
        run: |
          if ! bash scripts/build.sh; then
            test ! -f out/javac-diagnostics.txt || cat out/javac-diagnostics.txt
            exit 1
          fi
      - name: Enforce zero-warning API, permission, threading, lifecycle and drawing lint gate
        working-directory: project
        run: bash scripts/lint.sh
      - name: Save actual successful build evidence
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          report=Path('releases/BUILD-REPORT.txt').read_text()
          url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          Path('documentation/LATEST-VERIFIED-BUILD.md').write_text('# Latest verified build\n\n'+report+'\nCloud run: '+url+'\n\nNo physical device testing. Development signing only.\n')
          Path('STATUS.md').write_text('# MantisTV status\n\nNative API25 development build passed compilation, host tests, manifest/ABI/ZIP policy, signing and alignment checks. The source commit actually compiled is recorded below; this subsequent checkpoint changes only documentation.\n\n'+report+'\nCloud run: '+url+'\n\n76 catalog records were captured previously; all remain C without hardware evidence. No firmware binaries were downloaded. No physical device was connected or changed. All SDKs/build caches remained in the cloud, with no paid runners or metered Actions artifact uploads.\n\nNot complete: physical QA, real performance measurements, Android lint, persistent private release signing, provider Continue Watching, AirPlay/Apple Remote and other ecosystem integrations. See documentation/IMPLEMENTATION-BACKLOG.md and KNOWN-ISSUES.md.\n')
          PY
          git add documentation/LATEST-VERIFIED-BUILD.md STATUS.md
          git commit -m 'Record actual successful native build evidence'
          gh auth setup-git
          git push origin HEAD:main
      - name: Release verified API25 development preview
        working-directory: project
        run: |
          set -euo pipefail
          git archive --format=zip --output=releases/MantisTV-source.zip HEAD
          cp LICENSE documentation/INSTALLATION-GUIDE.md documentation/ROLLBACK-GUIDE.md releases/
          (cd releases && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          gh release create "quality-$GITHUB_RUN_ID" releases/* --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease --title 'MantisTV 0.4.0 API25 lint-checked development preview' --notes-file releases/BUILD-REPORT.txt
          cat releases/BUILD-REPORT.txt >> "$GITHUB_STEP_SUMMARY"
