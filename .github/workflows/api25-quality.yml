              "  LinearLayout header=new LinearLayout(this);header.setGravity(Gravity.CENTER_VERTICAL);TextView brand=text(\"MANTIS  /  \"+prefs.getString(\"name\"+profile,\"Profile \"+(Integer.parseInt(profile)+1)),18);brand.setTextColor(accent);header.addView(brand,new LinearLayout.LayoutParams(0,dp(48),1));header.addView(text(new SimpleDateFormat(\"HH:mm\",Locale.getDefault()).format(new Date()),17));root.addView(header);",
              "  HorizontalScrollView navScroll=new HorizontalScrollView(this);navScroll.setHorizontalScrollBarEnabled(false);LinearLayout nav=new LinearLayout(this);nav.setPadding(0,dp(4),0,dp(8));for(String name:new String[]{\"Home\",\"Library\",\"Search\",\"Recent\",\"Watchlist\",\"Controls\",\"Settings\"}){Button b=button(name,()->show(name));b.setTag(\"nav:\"+name);LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-2,dp(44));lp.setMargins(dp(4),0,dp(4),0);nav.addView(b,lp);}navScroll.addView(nav);root.addView(navScroll);",
              "  ScrollView scroll=new ScrollView(this);scroll.setClipToPadding(false);body=new LinearLayout(this);body.setOrientation(LinearLayout.VERTICAL);body.setPadding(dp(8),dp(8),dp(8),dp(18));scroll.addView(body);root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));",
